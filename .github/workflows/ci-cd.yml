name: CI/CD Pipeline

# CD / release is a DELIBERATE, human-triggered path — never an automatic
# per-push path. The old `push: [main, develop]` / `pull_request: [main]`
# triggers could never fire for our work: the repo default branch is
# wip/liuhao-x-evolve, work lands on p36, and `main` is a frozen legacy archive
# (last commit 2026-09-03). Consequence: this entire workflow executed ZERO
# times — `gh run list --workflow=ci-cd.yml` => [] — so the release gates it
# declares guarded nothing. Restricting to a manual dispatch + version tags
# keeps the writer-class jobs (docker login / build-push / deploy) under
# explicit human control and out of unscoped pushes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 是 `uv pip compile pyproject.toml` 的**默认依赖**产物，
          # **不含** `[tests]` extra（fakeredis / lupa）。只装它，
          # tests/distribution/ 下的协调 / 围栏用例会静默 skip ——
          # 而"跳过的绿"比红更危险。所以这里显式追加 tests extra。
          # （与 ci.yml 的 `pip install -e .[tests,etcd]` 保持同一安装面，
          #   避免两个 workflow 对"测试环境是什么"各说一套。）
          pip install -r requirements.txt
          pip install -e .[tests,etcd]
          pip install pytest-cov
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short -m "not integration and not e2e"
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=long -m integration
      - name: Check coverage
        run: python -m pytest tests/ --cov=src --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v4

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 这个 job 以前**根本没有装项目**（唯一的 pip 调用是装 bandit），
      # 却直接 `pytest tests/ -m security`。pytest 收集阶段就会 import src/，
      # 在没有 fastapi/pydantic/cryptography 的裸解释器上直接收集失败 ——
      # 实测：屏蔽这些第三方包后 `pytest tests/ -m security --collect-only`
      # 以 ImportError 退出（exit 1）。也就是说该 job 从来不可能变绿。
      # 由 scripts/verify_dependency_declaration_surface.py 检查 B 守住。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests,etcd]
      - name: Run security tests
        run: python -m pytest tests/ -v --tb=short -m security
      - name: Run bandit
        run: |
          python -m pip install --quiet bandit
          python -m bandit -r src/ -f sarif -o bandit-results.sarif || true
      - name: Upload security report
        if: hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    # CRITICAL-5: run even if 'test'/'security' failed, so downstream deploy gates
    # FAIL loudly instead of being silently SKIPPED. NOTE: the CRITICAL-5 watchdog
    # (scripts/verify_critical5_watchdog.py) requires a literal `always()` here;
    # `!cancelled()` is NOT accepted by it (it would read as "would SKIP silently
    # on red upstream"). Do not substitute another status function.
    # The old `if:` ALSO pinned `github.event_name == 'push'` and
    # `github.ref == 'refs/heads/main'`, which made this job UNREACHABLE for our
    # work (default branch != main, work lands on p36). Those pins are dropped
    # now — that is why the release gates below were declared but never executed.
    if: always()
    env:
      # C1 HOLD — DEFAULT ARMED, and deliberately NOT hardcoded to "1".
      # scripts/check_hold_gate.py reads LIUHAO_HOLD: UNSET => exit 0 (HOLD
      # inactive), so a release could proceed with no freeze actually in force
      # (that was the real state: the variable was never set anywhere in
      # .github/). The repo variable wins when present; otherwise default to "1"
      # so the freeze is ON (fail-safe, matching the standing `# HOLD`).
      # Why not a bare "1": lifting the freeze must be a PLATFORM action (set the
      # repo variable LIUHAO_HOLD=0 in GitHub, which is audit-logged), not a code
      # change + deploy. Hardcoding "1" would make lifting the freeze heavier
      # than imposing it and would invite "edit the workflow" as a bypass.
      # Do NOT simplify this to a constant.
      LIUHAO_HOLD: ${{ vars.LIUHAO_HOLD || '1' }}
    steps:
      # CRITICAL-5 watchdog: fail loudly if a required upstream did not succeed.
      - name: CRITICAL-5 gate watchdog (test)
        uses: ./.github/actions/ci-gate-watchdog
        with:
          upstream-name: test
          upstream-result: ${{ needs.test.result }}
      - name: CRITICAL-5 gate watchdog (security)
        uses: ./.github/actions/ci-gate-watchdog
        with:
          upstream-name: security
          upstream-result: ${{ needs.security.result }}
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Install dependencies (for release gates)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Release gate — HOLD control (C1)
        # C1: LIUHAO_HOLD must hard-abort any release. A truthy value exits
        # non-zero (2) and fails THIS job before the push step below runs, so
        # no image is ever pushed / promoted while HOLD is active.
        run: python scripts/check_hold_gate.py
      - name: Release gate — GO readiness (UU-01)
        # UU-01: separates "P0-8 matrix green" from "GO-ready". Fails (no push)
        # when HC-01 is not COMPLIANT or the deployment does not arm CRITICAL.
        # ORDERING NOTE: the HOLD control above exits 2 while the freeze is armed,
        # failing the job BEFORE this step. With LIUHAO_HOLD defaulting to armed,
        # this GO gate therefore only actually EXECUTES once the freeze is lifted
        # (LIUHAO_HOLD=0). That is intended — a frozen system should not even
        # reach the GO decision — but it means "GO ran" implies "HOLD was off".
        run: python scripts/verify_go_readiness.py
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    # CRITICAL-5: run even if 'build' failed, so the deploy gate FAILS loudly
    # instead of being silently SKIPPED (a red build must not mask a green deploy).
    # Must stay a literal `always()` for that watchdog.
    if: always()
    steps:
      # CRITICAL-5 watchdog: fail loudly if the required 'build' job did not succeed.
      - name: CRITICAL-5 gate watchdog (build)
        uses: ./.github/actions/ci-gate-watchdog
        with:
          upstream-name: build
          upstream-result: ${{ needs.build.result }}
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "::error::No real staging deployment is configured in this workflow."
          echo "This step used to end with 'Staging deployment simulated', so the job"
          echo "reported SUCCESS for a deployment that deployed nothing. It now fails"
          echo "on purpose: a green pipeline has to mean something actually shipped."
          echo "The real, verified CD path is .github/workflows/verify_metrics_persist.yml."
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    # CRITICAL-5: run even if 'deploy-staging' failed, so the deploy gate FAILS
    # loudly instead of being silently SKIPPED.
    # Must stay a literal `always()` for that watchdog.
    if: always()
    steps:
      # CRITICAL-5 watchdog: fail loudly if the required 'deploy-staging' job did not succeed.
      - name: CRITICAL-5 gate watchdog (deploy-staging)
        uses: ./.github/actions/ci-gate-watchdog
        with:
          upstream-name: deploy-staging
          upstream-result: ${{ needs.deploy-staging.result }}
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "::error::No real production deployment is configured in this workflow."
          echo "This step used to end with 'Production deployment simulated', so the job"
          echo "reported SUCCESS for a deployment that deployed nothing. It now fails"
          echo "on purpose: a green pipeline has to mean something actually shipped."
          echo "The real, verified CD path is .github/workflows/verify_metrics_persist.yml."
          exit 1