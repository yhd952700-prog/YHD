name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short -m "not integration and not e2e"
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=long -m integration
      - name: Check coverage
        run: python -m pytest tests/ --cov=src --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v4

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run security tests
        run: python -m pytest tests/ -v --tb=short -m security
      - name: Run bandit
        run: |
          python -m pip install --quiet bandit
          python -m bandit -r src/ -f sarif -o bandit-results.sarif || true
      - name: Upload security report
        if: hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "::error::No real staging deployment is configured in this workflow."
          echo "This step used to end with 'Staging deployment simulated', so the job"
          echo "reported SUCCESS for a deployment that deployed nothing. It now fails"
          echo "on purpose: a green pipeline has to mean something actually shipped."
          echo "The real, verified CD path is .github/workflows/verify_metrics_persist.yml."
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "::error::No real production deployment is configured in this workflow."
          echo "This step used to end with 'Production deployment simulated', so the job"
          echo "reported SUCCESS for a deployment that deployed nothing. It now fails"
          echo "on purpose: a green pipeline has to mean something actually shipped."
          echo "The real, verified CD path is .github/workflows/verify_metrics_persist.yml."
          exit 1