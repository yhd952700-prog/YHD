name: Verify Metrics Persistence

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      METRICS_PERSIST: '1'
      DATABASE_URL: 'sqlite:///./verify_metrics.db'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install sqlalchemy
      - name: Run verify script
        run: |
          python -u scripts/verify_metrics_persist.py
      - name: Upload verification database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-metrics-db
          path: verify_metrics.db
          if-no-files-found: ignore
mkdir -p /tmp/metrics-verify
cd /tmp/metrics-verify
export METRICS_PERSIST=1
export DATABASE_URL="sqlite:////tmp/metrics-verify/verify_metrics.db"
python /path/to/repo/scripts/verify_metrics_persist.py
python - <<'PY'
import sqlite3
conn = sqlite3.connect("/tmp/metrics-verify/verify_metrics.db")
print("COUNT:", conn.execute("SELECT COUNT(*) FROM provider_metric_samples").fetchone()[0])
print(conn.execute("SELECT provider, model, latency_ms, success_rate FROM provider_metric_samples ORDER BY id DESC LIMIT 5").fetchall())
conn.close()
PY
