name: doc-audit-claim-lint

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
  push:
    branches:
      - p36
      - main
    paths:
      - 'docs/**/*.md'
      - 'scripts/lint_audit_claims.py'

jobs:
  lint-audit-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for git diff against HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint HC-01 audit tamper / evidence-source claims
        run: python scripts/lint_audit_claims.py
        # Default (no args) = CI mode: scans docs/**/*.md files changed vs HEAD.
        # Fails (exit 1) if any changed doc asserts HC-01 is tamper-proof / a
        # verified true evidence source WITHOUT the UNVERIFIED / forked caveat.
