name: doc-audit-claim-lint

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'ACCEPTANCE.md'
      - 'CONTRIBUTING.md'
      # GOVERNANCE (法度明, 2026-10): these two root-level readiness documents
      # assert audit-integrity status in their G10 / release-gate sections. They
      # were absent from both this path filter AND the linter's
      # OUTWARD_SURFACE_FILES tuple, so an un-caveated tamper/evidence claim in
      # either file could not fail CI — proven: an explicit run against them
      # reported 4 findings while a CI-mode run reported `targets: 0 ... PASS`.
      - 'MASTER_PROJECT_READINESS.md'
      - 'RELEASE-READINESS-CONTRACT.md'
      - 'scripts/lint_audit_claims.py'
      - 'apps/**/*.md'
      - 'libs/**/*.md'
      - 'oss-ecosystem/**/*.md'
      - 'skills/**/*.md'
      - 'LiuHao-O/**/*.md'
  push:
    branches:
      - p36
      - main
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - 'ACCEPTANCE.md'
      - 'CONTRIBUTING.md'
      - 'MASTER_PROJECT_READINESS.md'
      - 'RELEASE-READINESS-CONTRACT.md'
      - 'apps/**/*.md'
      - 'libs/**/*.md'
      - 'oss-ecosystem/**/*.md'
      - 'skills/**/*.md'
      - 'LiuHao-O/**/*.md'
      - 'scripts/lint_audit_claims.py'

jobs:
  lint-audit-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for git diff against HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint HC-01 audit tamper / evidence-source / compliance claims
        run: python scripts/lint_audit_claims.py
        # Default (no args) = CI mode: scans docs/**/*.md AND the documented
        # outward-facing surfaces (README.md, ACCEPTANCE.md, CONTRIBUTING.md,
        # apps/**, libs/**, oss-ecosystem/**, skills/**, LiuHao-O/**) changed
        # vs HEAD. Fails (exit 1) if any changed doc asserts HC-01 is
        # tamper-proof / a verified true evidence source, HC-09/HC-10 are
        # durable/authoritative, or makes a compliance/liability claim
        # (GDPR/CCPA/PII/privacy/legal-accountability) WITHOUT the required
        # caveat. This is a technical claim-guard, NOT a legal/compliance
        # certification.
