name: Release Readiness

# RELEASE-READINESS-CONTRACT.md gate battery (scripts/verify_readiness.py).
# Wired here on purpose: an unwired verify_*.py fails tests/test_guardrail_scripts.py,
# which is the meta-guardrail that keeps the 25+ gate scripts from silently decaying.
# The script exits 2 only when a condition is genuinely contradicted (FAIL); NOT
# VERIFIED / BLOCKED are pending verification and do not fail the run. As of this
# commit every condition is PASS / NOT VERIFIED / BLOCKED, so this job is green;
# if a real regression makes a check FAIL, CI goes red -- which is the point.

on:
  push:
    branches: ['p36']
  pull_request:
    branches: ['p36']

jobs:
  readiness:
    name: Release Readiness Contract (C1..C12)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 2026-10-07 换镜像：原 `bitnami/etcd:3.5` 的 manifest 已从 Docker Hub 下线，
      # 服务容器起不来 -> 整个 job 在 setup 阶段就死，pytest 从未执行（实测 53 次
      # 运行 0 成功）。改用 quay.io/coreos/etcd:v3.5.34（manifest 实测 HTTP 200）。
      # coreos 系不认 bitnami 专属变量（ALLOW_NONE_AUTHENTICATION / ETCD_ENABLE_V2），
      # 无鉴权是 etcd 默认行为，故删除而非改名；health-cmd 必须显式给
      # ETCDCTL_API=3 与 --endpoints，否则探针恒失败。
      etcd:
        image: quay.io/coreos/etcd:v3.5.34
        ports:
          - 2379:2379
        env:
          ETCDCTL_API: "3"
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
        options: >-
          --health-cmd "/usr/local/bin/etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests,etcd]

      - name: Run release-readiness contract (full — executes the suite for C3/C12)
        # --full makes check_tests / check_no_major_failures actually EXECUTE the
        # full pytest suite (not just collect), so C3 (Stable tests) and C12 (No
        # unexplained major failures) flip from NOT VERIFIED to PASS on a permanent
        # CI artifact. C7 stays NOT VERIFIED on CI by design (its numeric gate is
        # profile-keyed and SKIPs on the Linux runner — the machine-independent
        # invariants remain the blocking check and PASS). The script exits 2 only
        # on a real FAIL; NOT VERIFIED / BLOCKED do not fail the run.
        run: python scripts/verify_readiness.py --full

  independent-verification:
    name: Independent Verification (C10 harness)
    runs-on: ubuntu-latest
    needs: readiness
    # CRITICAL-5: run even if 'readiness' failed, so this gate FAILS loudly
    # instead of being silently SKIPPED.
    if: always()
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 2026-10-07 换镜像：原 `bitnami/etcd:3.5` 的 manifest 已从 Docker Hub 下线，
      # 服务容器起不来 -> 整个 job 在 setup 阶段就死，pytest 从未执行（实测 53 次
      # 运行 0 成功）。改用 quay.io/coreos/etcd:v3.5.34（manifest 实测 HTTP 200）。
      # coreos 系不认 bitnami 专属变量（ALLOW_NONE_AUTHENTICATION / ETCD_ENABLE_V2），
      # 无鉴权是 etcd 默认行为，故删除而非改名；health-cmd 必须显式给
      # ETCDCTL_API=3 与 --endpoints，否则探针恒失败。
      etcd:
        image: quay.io/coreos/etcd:v3.5.34
        ports:
          - 2379:2379
        env:
          ETCDCTL_API: "3"
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
        options: >-
          --health-cmd "/usr/local/bin/etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # CRITICAL-5 watchdog: fail loudly if the required 'readiness' job did not succeed.
      - name: CRITICAL-5 gate watchdog (readiness)
        uses: ./.github/actions/ci-gate-watchdog
        with:
          upstream-name: readiness
          upstream-result: ${{ needs.readiness.result }}
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests,etcd]

      - name: Run independent verification harness
        run: python scripts/independent_verification.py --emit verification_record.json

      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: independent-verification-record
          path: verification_record.json
          if-no-files-found: warn
