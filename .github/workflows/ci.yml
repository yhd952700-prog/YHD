name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 3.11 = declared floor (pyproject: requires-python >=3.11); 3.12 = local dev venv.
      # Both legs run so a version-specific regression cannot hide in the gap.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    # 真 redis-server：让 TestRealRedisEndToEnd（real redis）在 CI 上**真正执行**，
    # 不再 skip。TestRedisLuaScriptsActuallyExecute 走 fakeredis(+lupa)，两者互补：
    # fakeredis 验证 Lua 语义，真 redis 验证真实服务上的行为。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 真 etcd：让 TestRealEtcdEndToEnd（real etcd）在 CI 上**真正执行**（前提
      # 是 [etcd] extra 已装 etcd3）。与 redis 镜像同理，镜像自带的不依赖网络即可
      # 用 `etcdctl endpoint health` 做健康探针；CI 上若没装 etcd3，该组仍优雅 skip。
      etcd:
        image: bitnami/etcd:3.5
        ports:
          - 2379:2379
        env:
          ETCD_ENABLE_V2: "false"
          ALLOW_NONE_AUTHENTICATION: "yes"
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 装 [tests] extra 才会带上 fakeredis + lupa，让
          # TestRedisLuaScriptsActuallyExecute 在 CI 上**真正执行**（不再 skip）。
          # 缺 lupa 时该组在测试内优雅 skip（nodes fixture 的 eval 自检），不会把
          # 收集搞挂；但 CI 显式装齐才能把"skip"变成"已验证"。
          pip install -e .[tests,etcd]
          pip install flake8

      - name: Verify test collection is complete
        # Runs BEFORE the unit tests on purpose. A collection-time ImportError
        # aborts the whole pytest session, so the tests below would report a
        # failure that reads like "some tests are red" when in fact thousands
        # of them never ran. On 2026-10-04 exactly that happened (roster.py was
        # rewritten, its test's import was not) and 3592 tests vanished while
        # any subset run still looked green.
        run: python scripts/verify_test_collection.py

      - name: Run Unit Tests
        run: |
          if [ -d tests/ ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests directory found - skipping"
          fi

      - name: Verify Code Quality
        run: |
          python -m flake8 src/ --max-line-length=100 --select=E,F,W --ignore=E501,W503

      - name: Build Application
        run: |
          python -c "from src.ai.providers import get_provider; provider = get_provider(); print(f'Provider initialized: {provider.name}')" 

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: .
          retention-days: 7

  # Security scan job
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            aquasec/trivy:0.42.0 fs --format sarif --output trivy-results.sarif --exit-code 0 .

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # ── Bandit 真门禁（HIGH only，与 architecture-gate 同硬度）─────────────
      # 阈值取 --severity-level high：命中即失败，绝不 || true。MEDIUM/LOW 只
      # 采集不阻断，避免第一天就红导致门禁被无视（仓库既有纪律：规则须实测 0 命中）。
      # 唯一例外 B602 在 src/ai/world_interface.py:117 用**单行** nosec 抑制，
      # 原因见该行注释——shell=True 为显式 opt-in、默认关闭、经授权契约保护，非意外
      # 漏洞。要收紧只需删掉那行 nosec，该 HIGH 即重新阻断。lint job 处仅作全量采集。
      - name: Install Bandit (gate dependency)
        run: python -m pip install --quiet bandit

      - name: Bandit security gate (HIGH only, blocking)
        run: python -m bandit -r src/ --severity-level high -f json -o bandit-results.json

      - name: Upload Bandit Results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json
          if-no-files-found: ignore

      # 依赖 CVE 扫描（2026-09-13 新增）。Trivy 扫文件系统/容器层，Bandit 扫自研
      # 代码 —— 两者都看不到「第三方依赖自身的已知漏洞」，这是此前唯一的空白面。
      # 实测基线（本机 .venv，mcp 1.29.1 环境）：直接依赖 0 条 CVE；全部命中都来自
      # venv 自带的旧 pip(25.0.1)，故这里先升级 pip 再审计，以去除无关噪音。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pip-audit (dependency CVE scan)
        run: |
          # 刻意用独立 venv：被审计环境里只有一个「刚升级过的 pip」，避免 runner
          # 自带的老 pip 贡献十几条与项目无关的告警（安全扫描的告警疲劳）。
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --quiet --upgrade pip
          .audit-venv/bin/python -m pip install --quiet -e .
          .audit-venv/bin/python -m pip install --quiet pip-audit
          # 非阻断式：与 Trivy(--exit-code 0) / Bandit(|| true) 口径一致 —— pip-audit
          # 命中漏洞即 exit 1，故必须兜底。待 CI 连跑两轮稳定为 0 后可去掉 `|| true`。
          # 注：pip-audit 2.10.1 **没有** --exit-code 参数（实测），不要照搬别的工具写法。
          .audit-venv/bin/python -m pip_audit --skip-editable --progress-spinner off \
            | tee pip-audit-results.txt || true

      - name: Upload pip-audit Results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.txt
          if-no-files-found: ignore

  # Observability validation job
  observability:
    name: Observability Validation
    runs-on: ubuntu-latest
    needs: security
    # 跟随**默认分支**而非硬编码 main：Round 78 已把默认分支切为
    # wip/liuhao-x-evolve，main 停在 2026-09-03（legacy 归档），
    # 硬编码 main 会让本作业**永久不运行**（= 声明了却零保护）。
    # 用 default_branch 可自愈：以后换默认分支不必再改这里。
    # 已知局限：pull_request 事件下 github.ref_name 不是分支名，故 PR 上仍不跑。
    if: github.ref_name == github.event.repository.default_branch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -e .
          pip install langfuse arize-phoenix

      - name: Run Observability Checks
        run: python scripts/ci_observability_check.py

  # Guardrails: every `scripts/verify_*.py` that carries a pass/fail contract.
  # These scripts protect the Policy route C invariants (C-1..C-5), the D8 risk
  # registry, AI-layer audit delegation, and the ORM/migration + cross-session
  # persistence guarantees.
  # Each one exits non-zero on violation, so a red job here is a real gate.
  # Counted, not assumed: `ls scripts/verify_*.py | wc -l` = 36 (2026-09-30).
  # tests/test_guardrail_scripts.py enforces that EVERY one of them is invoked by
  # some workflow, sys.path-bootstrapped, and able to exit non-zero -- so adding a
  # script without wiring it turns CI red, which is the point: a guard nobody runs
  # protects nothing. Keep the count honest when you add one.
  guardrails:
    name: Guardrails (Policy C-1..C-6, identity root, ORM, persistence)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install alembic sqlalchemy

      - name: Verify C-1 whitelist adjudication
        run: python scripts/verify_policy_c1.py

      - name: Verify D8 risk classification wiring
        run: python scripts/verify_d8_risk_classification.py

      - name: Verify C-2 enforcement switch is not armed by code
        run: python scripts/verify_c2_enforcement.py

      - name: Verify C-3 sovereignty / DEFER semantics
        run: python scripts/verify_c3_sovereignty.py

      - name: Verify C-4/C-5 approval channel and arming policy
        run: python scripts/verify_c4_approval_channel.py

      # C-6: measures that no armed action is reachable from production code.
      # Arming an action that production actually calls turns a working flow
      # into "wait for a human", so this fails CI at the moment such a call
      # site is written instead of surfacing as a production incident.
      - name: Verify every armed action is inert on production paths (C-6)
        run: python scripts/verify_armed_actions_are_inert.py

      # A4: decision / enforcement / evidence must be one event with one
      # correlation_id. Wired deliberately even though it currently exits 2:
      # exit 2 means "ALLOW+DENY closure proven, one probe UNVERIFIED (known
      # CRIT-1C gap: a CRITICAL action still runs when the audit write fails)".
      # An unwired guard protects nothing, and hiding a known gap behind an
      # unwired script is worse than showing it. So: 0 or 2 passes, 1 (a real
      # closure regression) fails. When CRIT-1C is fixed, tighten this to
      # require 0.
      - name: Verify A4 same-decision-point closure
        run: |
          set +e
          python scripts/verify_same_decision_point_closure.py
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
            echo "A4 closure: no regression (exit $code; 2 = known UNVERIFIED gap, tracked)"
            exit 0
          fi
          echo "::error ::A4 closure gate failed (exit $code)"
          exit 1

      - name: Verify AI-layer audit delegation (probe self-validation)
        run: python scripts/verify_ai_layer_audit.py

      # Real execution + honest failure (WS1): proves a capability genuinely
      # executes end-to-end, and that neither a sandbox rejection nor an unwired
      # capability is masked as success by the Execution Kernel.
      - name: Verify real execution and honest failure (WS1)
        run: python scripts/verify_real_execution.py

      # Licenses drift silently (Redis v8 -> AGPLv3, Elasticsearch -> SSPL).
      # A version pin never tells you that; this does.
      - name: Verify OSS component licenses against oss-registry.yaml
        run: python scripts/verify_oss_licenses.py

      # oss-ecosystem/capabilities/*.yaml 的字段契约。schema 从 2026-09-13 起就写着
      # 「让『每个发现的项目都必须分析』变成**可校验**的事」并指名了 pipeline/validate_entries.py，
      # 但那个文件直到 2026-09-15 才真正存在 —— 在此之前，5 条 license 被记成裸 NOASSERTION
      # 且风险等级填错（违反 schema 第 21 行）而没有任何东西发现。
      # 与 tests/test_oss_ecosystem_entries.py 双保险：这里跑真实语料，
      # 那里额外反证「注入违规必须变红」，防止门禁退化成 no-op。
      - name: Verify oss-ecosystem capability entries against the field contract
        run: python oss-ecosystem/pipeline/validate_entries.py

      # Every silent defect in this repository shared one shape: code written but
      # never called (msg_bus, MultiTierCache, BatchCache, Evaluator,
      # generate_metrics). An orphan is not automatically a bug, but an orphan
      # nobody decided about is. This makes the decision explicit and mechanical.
      #
      # ⚠️ Known limitation (PHASE 3.6, measured — see
      # D:/WorkBuddyFiles/LIUHAO-Phase3.6-Evidence/p36_tm_orphan_guard_control.py):
      # this guard's reachability test is a regex over raw file text, so it counts
      # a DOCSTRING mention as a call site and conflates modules sharing a final
      # path segment. src.identity (zero importers) is therefore classified as
      # "referenced" and cannot be flagged by it. T-M's single-identity-root guard
      # below is AST-based and does not have that hole; the two are complementary.
      - name: Verify every zero-reference module is acknowledged
        run: python scripts/verify_no_undocumented_orphans.py

      # The published HTTP contract must equal what the code actually serves.
      # openapi.yaml was found (2026-10-04) to declare 6 paths of which ZERO
      # existed at runtime, while omitting all 58 real paths -- i.e. it described
      # an API the gateway does not implement. A declared-but-absent endpoint is
      # an *invented capability*, which is worse than a stale doc: it invites an
      # integrator or an agent to build against a surface that was never there.
      # This re-derives the spec from the in-process app and fails on any ghost,
      # omission, or HTTP-method disagreement. Regenerate deliberately with
      # `python scripts/verify_openapi_contract.py --write`; never by hand.
      - name: Verify published OpenAPI contract matches the running gateway
        run: python scripts/verify_openapi_contract.py

      # Countable claims in the authoritative kernel list must be re-derivable.
      # docs/spec/KERNEL-CANON.md calls itself "the single authoritative source",
      # yet its v1.0 table had14/14 wrong line counts (audit claimed 423, actually
      # 2,288 in __init__.py), and the total printed beneath it ("合计 6,391") did
      # not match the sum of its own rows (6,581) -- a self-contradiction on one
      # page of the file everything else defers to. A count nobody can recompute
      # is indistinguishable from a guess. This re-derives every kernel row from
      # `git show HEAD:` and fails on any drift or self-inconsistency.
      - name: Verify countable claims in KERNEL-CANON against the committed code
        run: python scripts/verify_doc_count_claims.py

      # A relative markdown link is a claim that the thing it names is over
      # there. docs/ARCHITECTURE.md linked `../CODEX-CONTRACT.md` twice -- that
      # file lives in docs/, not the repo root -- and one of those links sat in
      # the "reader should read this first" navigation table, so the entry point
      # it recommended to an AI coding agent was dead. docs/archive/ is excluded
      # BY ITS OWN declared policy ("preserve as-is"): its file:/// absolute
      # links are a faithful record of the paths as they were, and rewriting
      # history to satisfy a linter would be the worse lie.
      - name: Verify no relative markdown link dangles
        run: python scripts/verify_doc_links.py

      # docs/README.md is the reader's map: it must actually index the docs
      # tree. Measured 2026-10-04 it named only 38 of 135 markdown files and
      # listed 9 of 15 directories in its structure block -- so a reader who
      # trusts the index concludes the project has no governance charter, no
      # blueprint-upgrade packages, and no ADR set. This makes every live doc's
      # presence (and every path the index claims) mechanical, so a future edit
      # that silently drops 70% of the tree turns CI red instead of misleading.
      - name: Verify docs/README.md indexes the whole docs tree
        run: python scripts/verify_docs_index_coverage.py

      # PHASE 3.6 / T-M (F29 6 and F30 1): exactly one identity implementation may
      # be imported. Two modules both described themselves as the "single Identity
      # Authority" and neither said which one that was -- an undeclared second
      # identity root is a trust-root ambiguity, not redundancy. This parses every
      # .py file for real import statements, so a prose mention can neither
      # satisfy nor violate it.
      - name: Verify the single authoritative identity implementation
        run: python scripts/verify_single_identity_root.py

      # PHASE 3.6 / A1 + A3 (R-15b / F29): the identity trust root must be
      # structurally incapable of the day-one deterministic privilege escalation
      # (a human registry row taking an agent's slot), and -- when the integrity
      # key is configured -- must refuse unauthenticated rows fail-closed. This
      # drives the REAL IdentityManager against a REAL on-disk store (both the
      # file and SQLite backends); it is not a unit test and it mocks nothing.
      - name: Verify R-15b identity trust-root containment (runtime)
        run: python scripts/verify_r15b_identity_trust_root.py

      # PHASE 3.6 / P0-3 (boss decision 2026-09-22): the human registry integrity
      # posture must be observable / auditable / deployment-gate aware. This
      # surfaces it; it exits 0 by default (report only) so existing deployments
      # without a key are not broken, but a strict gate can opt into hard-fail.
      - name: Verify human registry integrity posture (deployment gate aware)
        run: python scripts/verify_human_registry_integrity_state.py

      # PHASE 3.6 / P0-4 (A2): the audit principal identity must not collapse --
      # before the A2 fix every @kernel_action wrote the literal "kernel" as the
      # subject, so a human approval and an agent action were indistinguishable
      # in the only durable record. This drives the REAL @kernel_action execution
      # path against a REAL on-disk (SQLite, hash-chained) audit store and
      # re-reads the durable record independently. It mocks nothing.
      - name: Verify A2 audit principal identity does not collapse (runtime)
        run: python scripts/verify_a2_audit_principal_identity.py

      # PHASE 3.6 / P0-5 (A2 + F33): the authorization source -- the actor
      # _adjudicate returns as "who did / authorised this" -- must be the SAME
      # subject written to the durable audit record, with no drift and no
      # sovereignty-washing (a refused sovereignty claim must not read as a live
      # human window). Drives the REAL CRITICAL @kernel_action capability.retire
      # against a REAL on-disk (SQLite, hash-chained) audit store, opens REAL
      # sovereignty windows, and re-reads the durable record independently.
      - name: Verify P0-5 authorization source integrity (runtime)
        run: python scripts/verify_p05_authorization_source_integrity.py

      # PHASE 3.6 / P0-6 (F33 / D-2): a sovereignty window carries only a
      # grant_id snapshot; the authorization it grants must be RE-RESOLVED from
      # the grant registry at every adjudication. A grant revoked / expired /
      # issued to a different principal after the window opened must fail-closed
      # to the service actor (no stolen-human approval). Drives the REAL CRITICAL
      # @kernel_action capability.retire against a REAL on-disk hash-chain store
      # with REAL issued/revoked grants, and re-reads the record independently.
      - name: Verify P0-6 revocable-grant read-path (F33) runtime
        run: python scripts/verify_p06_revocable_grant_read_path.py

      # PHASE 3.6 / U42 (authorization integrity): the autonomous actor must
      # inherit the default-deny kernel, and every WorldInterface construction
      # must set an explicit actor= so it cannot silently fall back to the human
      # default-allow posture. Static enforcement of the U42 invariant; it also
      # fails CI if the central autonomous execution-fence gate or the
      # WorldInterface deny line is ever removed (a gate that vanished must be loud).
      - name: Verify U42 autonomous-actor default-deny + explicit actor (static)
        run: python scripts/verify_u42_autonomous_actor.py

      # PHASE 3.6 / U53 (Root of Trust: no one signs the chain head). This gate is
      # a self-test of the Root-of-Trust chain-head signing primitive
      # (src/kernels/audit/root_of_trust.py): it proves the capability EXISTS and
      # is fail-closed (round-trip, tamper rejected, wrong-key rejected, unknown
      # sig_alg fail-closed, opt-in unconfigured refuses to sign). It does not
      # assert the live HC-01 chain is signed in prod -- that integration is the
      # next step, gated on HC-01 stabilisation.
      - name: Verify U53 Root-of-Trust chain-head signing primitive (self-test)
        run: python scripts/verify_u53_root_of_trust.py

      # PHASE 3.6 / U53 HA (high availability): a single TSA is a SPOF. This gate
      # is a self-test of the K-of-M quorum TSA (src/kernels/audit/trusted_timestamp.py):
      # a 3-member / quorum-2 authority mints + verifies a bundle; below-threshold
      # rejects; an unknown-TSA token is ignored; a tampered payload fails every
      # member; a member outage is tolerated (unless require_full); and the quorum
      # bundle composes with the U53 RoT attestation fail-closed. It does not
      # assert the live HC-01 chain is quorum-timestamped in prod -- that
      # integration is the next step, gated on HC-01 stabilisation.
      - name: Verify U53 high-availability K-of-M quorum TSA (self-test)
        run: python scripts/verify_u53_tsa_quorum.py

      # PHASE 3.6 / U51 (no single value commits its own history => cheap
      # notarization/inclusion-proof infeasible): this gate is a self-test of the
      # chain-head notary (src/kernels/audit/inclusion_proof.py): a Merkle
      # accumulator over signed heads so any historical signed head carries a
      # trustless inclusion proof into the canonical timeline. It proves the
      # capability EXISTS and is fail-closed (round-trip, tamper rejected,
      # uncheckpointed-head refused, tampered-persisted-file refused, forged root
      # detected by self-consistency), and that the published root composes with
      # the U53 RoT (the root is itself RoT-attested). Live HC-01 notarisation is
      # the next step, gated on HC-01 stabilisation.
      - name: Verify U51 chain-head notary / inclusion-proof primitive (self-test)
        run: python scripts/verify_u51_inclusion_proof.py

      # PHASE 3.6 / U51 external anchor: the notary's PUBLISHED ROOT -- and the
      # notary file -- live under the operator's control, so an operator could
      # rewrite the root itself. This gate is a self-test of the transparency-log
      # anchor (src/kernels/audit/transparency_anchor.py): each published notary
      # root is committed to an operator-INDEPENDENT, signed, append-only log, so
      # an auditor can verify a root was anchored by a key the operator does not
      # hold. Fail-closed (tampered root / forged signature / broken chain
      # linkage / tampered persisted file rejected). Live HC-01 anchoring is the
      # next step, gated on HC-01 stabilisation.
      - name: Verify U51 transparency-log anchor of published notary roots (self-test)
        run: python scripts/verify_u51_transparency_anchor.py

      # PHASE 3.6 / U51 REAL external anchor: the local-key "operator-independent"
      # log in transparency_anchor.py REGENERATES its key every run, so it is not
      # a true external anchor. This gate is a self-test of the REAL external
      # anchor (src/kernels/audit/external_anchor.py): the trust anchor is an
      # EXTERNAL public key PINNED OUT-OF-BAND (never generated by the audit
      # process), and the proof format is RFC 6962 (Merkle inclusion proof + signed
      # tree head). An auditor verifies against the pinned external key WITHOUT
      # trusting the operator. Fail-closed (tampered root / forged STH signature /
      # missing external key rejected); a reference/CI log is reported honestly as
      # SELF-ATTESTED, never as "independently verified". Live HC-01 external
      # anchoring is the next step, gated on HC-01 stabilisation.
      - name: Verify U51 REAL external transparency-log anchor (RFC 6962, out-of-band key) (self-test)
        run: python scripts/verify_u51_external_anchor.py

      # PHASE 3.6 / U51C (external anchor key ceremony): the U51X gate RUNTIME-
      # GENERATES the reference key, so it does not prove the out-of-band
      # provisioning workflow that external_anchor.py actually requires (the
      # trust anchor must be PINNED OUT-OF-BAND, never generated by the audit
      # process). This gate consumes the pinned, ceremony-issued external key and
      # verifies anchored receipts against it using ONLY the public key (the
      # production security property: the audit runtime never holds the external
      # private key). Fail-closed: ceremony self-signature possession proof,
      # anchored-log consistency, honest SELF-ATTESTED reporting (no false
      # independence claim), tampered anchored log refused, missing external key
      # refused. The committed public artifacts live in config/external_anchor/
      # (the private key is gitignored).
      - name: Verify U51 external anchor key ceremony (pinned out-of-band key) (self-test)
        run: python scripts/verify_u51_external_anchor_ceremony.py

      # PHASE 3.6 / FENCE (Q3.5 / #99): the single-writer fence is the most
      # load-bearing audit-integrity invariant after the hash chain, but it was
      # only covered by pytest -- NOT by a fail-closed CI gate and NOT by the
      # unified verify_audit_integrity.py aggregate. So a regression of the
      # append-path fence wiring would leave the canonical aggregate green. This
      # gate drives the REAL AuditStore on a hermetic temp DB and proves both
      # that normal writes succeed AND that a fenced/intruder writer is refused
      # (StaleWriterError). Fail-closed: rc 2 on any violation. It is folded into
      # the unified aggregate as gate FENCE.
      - name: Verify audit single-writer fence on the live append path (self-test)
        run: python scripts/verify_fence_single_writer.py

      # PHASE 3.6 / F6 (RCA-1 recurrence guard, HC-01 team-owned engineering):
      # the unified aggregate above drives HERMETIC temp stores or re-derives the
      # seven JSON chains -- NONE of them open the actual DEPLOYED
      # audit_store.db. So a re-fork of the live store (concurrent non-atomic
      # seq assignment -> duplicate seq, broken hash-chain joins) would go
      # UNNOTICED by CI. This gate reads the LIVE store READ-ONLY (it never
      # writes/repairs/restores/migrates/rebuilds it -- those are frozen
      # human-sovereign HC-01 decisions) and asserts verify_integrity() ok AND
      # duplicate_seq_count() == 0. A missing live store is a SKIP (exit 0), not
      # a silent pass. Fail-closed: rc 2 on any fork/tamper signal. It does NOT
      # assert HC-01 VERIFIED.
      - name: Verify live audit_store.db is not forked (RCA-1 recurrence guard, F6)
        run: python scripts/verify_audit_chain_no_fork.py

      # PHASE 3.6 / UNIFIED audit-integrity aggregate: a single fail-closed gate that
      # re-derives ALL six P08/U51/U53 gates in separate subprocesses (builder-
      # decoupled -- the builder cannot fake a gate it does not run) and fails the
      # whole command if any one fails. Closes the gap that independent_verification.py
      # (G10) does NOT compose the U51/U53 gates. Emits a tamper-evident record_hash.
      - name: Verify unified audit-integrity aggregate (P08 + U51 + U53, fail-closed)
        run: python scripts/verify_audit_integrity.py

      # PHASE 3.6 / P0-7 (B2): every dual-signature evidence record -- a human's
      # sovereign override assertion and an independent verifier's confirmation --
      # must explicitly record its signature algorithm (sig_alg) and verification
      # must dispatch on it. Unknown algorithms fail-closed with NO default
      # fallback. Generates REAL RSA-3072 signatures, persists them, re-reads from
      # disk independently, and proves sig_alg == actual verification algorithm.
      - name: Verify P0-7 B2 dual-signature evidence sig_alg (runtime)
        run: python scripts/verify_p07_dual_signature_sig_alg.py

      # PHASE 3.6 / P0-8b (D2): the HASH-CHAIN VERIFICATION MATRIX. Declares,
      # for EVERY chain HC-01..HC-11, the five attributes the containment
      # requires (hash_alg / canonicalization / prev_hash participation /
      # verify path / fail-closed) and PROVES each at runtime against the real
      # code. Unconfirmable facts are reported as UNVERIFIED and are never
      # filled in by assumption; known defects are listed as GAPS.
      - name: Verify P0-8b hash-chain matrix HC-01..HC-11 (runtime)
        run: python scripts/verify_p08b_chain_matrix.py

      # PHASE 3.6 / P0-8b + P0-8c (D2): every on-disk JSON hash chain
      # (HC-02..HC-08) must declare its algorithm (hash_alg) explicitly and
      # verify by dispatching on that declared name -- unknown algorithms fail
      # closed with NO default fallback. The script performs a REAL filesystem
      # round-trip per chain (independent reload + tamper + unknown-alg) and
      # exits non-zero on any violation, so this is the bundle / deployment
      # rebuild gate, not a no-op.
      - name: Verify P0-8b/8c hash-chain sig_alg (runtime, deployment gate)
        run: python scripts/verify_p08_hash_chain_sig_alg.py

      # PHASE 3.6 / P0-8 technical closure: the FINAL STATUS MATRIX for every
      # chain HC-01..HC-11, derived at runtime from eight dimensions
      # (declaration / canonicalization / prev_hash rule / persistence /
      # verification / tamper detection / unknown-algorithm behaviour /
      # migration state). Status vocabulary is closed: COMPLIANT, LEGACY,
      # UNVERIFIED, BLOCKED -- never a fuzzy "mostly done".
      #
      # Each chain also DECLARES the status it is expected to hold, so if
      # runtime evidence derives something different the step goes red. That is
      # what keeps this matrix from decaying into decoration.
      - name: Verify P0-8 hash-chain final status matrix HC-01..HC-11 (runtime)
        run: python scripts/verify_p08_final_status_matrix.py

      # Compliance-liability claim linting (scripts/lint_audit_claims.py).
      # Standalone, pytest-free verifier: proves the rule's hit/miss behaviour so
      # the claim scanner cannot silently stop catching liability language.
      # Wired here because an unwired gate protects nothing -- the guardrail
      # meta-test (tests/test_guardrail_scripts.py) rejects any verify_*.py that
      # no workflow invokes.
      - name: Verify compliance-liability claim lint rules (standalone)
        run: python scripts/verify_compliance_lint.py

      # Alert-rules provenance (alertconfig-fix): every Prometheus alert must key
      # on a metric that src/ actually increments/sets (or that a running exporter
      # provides), else the alert can never fire and reads as coverage. This is the
      # regression gate for configs/observability/{prometheus.yml,rules/*.yml}.
      # AST-based, not a hardcoded allowlist, so a dead metric cannot be silently
      # re-added. Must be wired here or test_guardrail_scripts.py fails it.
      - name: Verify Prometheus alert rules only reference produced metrics
        run: python scripts/verify_alert_rules.py

      - name: Migrate a scratch database
        run: |
          rm -f ci_guardrail.db
          DATABASE_URL="sqlite:///./ci_guardrail.db" python -m alembic upgrade head

      - name: Verify ORM models match the migrated schema
        env:
          DATABASE_URL: sqlite:///./ci_guardrail.db
        run: python scripts/verify_orm_vs_db.py

      - name: Verify cross-session persistence
        env:
          DATABASE_URL: sqlite:///./ci_guardrail.db
        run: python scripts/verify_persistence.py

  # ─────────────────────────────────────────────────────────────────────────
  # Guardrails, extended set: 16 more `scripts/verify_*.py` gates that were
  # written, cited as evidence in PRODUCT-READINESS.md, and yet never invoked
  # by any workflow -- i.e. protecting nothing. An unwired guardrail is decay.
  #
  # Split into its own job (not folded into `guardrails` above) because that job
  # already carries ~30 steps against a 15-minute budget; adding 16 more would
  # turn a timeout into a false red.
  #
  # DELIBERATELY NOT WIRED -- 4 gates remain unwired, each with the measured
  # reason it cannot produce a valid verdict on a GitHub-hosted runner. They
  # stay unwired on purpose: hiding them behind DIAGNOSTIC_REPORTERS or
  # `|| true` would suppress a true positive, which is the dishonesty this
  # repo forbids. tests/test_guardrail_scripts.py therefore still reports
  # them -- that red entry is the signal, not a nuisance. Each has its own
  # remediation task.
  #
  # `verify_deploy_readiness` was on this list until it was wired at the
  # `guardrails-extended` step below, after its alembic-invocation portability
  # defect was fixed. Kept out of the list deliberately: a stale entry here
  # reads as "known broken" when the gate is in fact running, which is the
  # mirror image of the false green this job exists to prevent.
  #
  # NOTE ON FORMATTING: the names below are written WITHOUT the `.py` suffix
  # on purpose. The meta-guardrail greps the raw workflow text for a script's
  # basename, so spelling them out in full here would make four genuinely
  # unwired gates read as wired -- a false green, i.e. the exact decay this
  # job exists to prevent. Keep them suffix-less.
  #   * verify_deployment_gate_vars     -- GENUINE FAIL (runs clean, reports
  #                                        12 findings: 7 gates genuinely unset
  #                                        in the artifacts + 3 unclassified
  #                                        candidates + 2 read indirectly via
  #                                        a constant and needing human
  #                                        confirmation). The 12 are a human
  #                                        decision, tracked in the task list.
  #   * verify_deployed_product_closure -- needs a Docker daemon AND a
  #                                        headless browser.
  #   * verify_image_build              -- needs a Docker daemon.
  #   * verify_observability_loop       -- needs a live Prometheus /
  #                                        Alertmanager stack on
  #                                        8010/9090/9093.
  guardrails-extended:
    name: Guardrails Extended (audit/identity/execution/employee/user-surface)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    # Isolation, belt-and-braces. These gates redirect persistence themselves,
    # but a gate that ever forgets must not land artifacts in a real workspace
    # or a real audit DB: verify_p6_e2e_file_creation.py once wrote test
    # artifacts into the production workspace because the workspace root and
    # the assertion target diverged. Pinning the roots here makes that class of
    # mistake impossible for this job.
    env:
      LIUHAO_WORKSPACE_ROOT: ${{ runner.temp }}/liuhao-ws
      AUDIT_DB_PATH: ${{ runner.temp }}/liuhao-audit/audit.db
      LIUHAO_ALERTS_STORE_PATH: ${{ runner.temp }}/liuhao-alerts.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install alembic sqlalchemy

      - name: Create the isolated workspace / audit roots
        run: |
          mkdir -p "$LIUHAO_WORKSPACE_ROOT"
          mkdir -p "$(dirname "$AUDIT_DB_PATH")"
          echo "workspace root: $LIUHAO_WORKSPACE_ROOT"
          echo "audit db path:  $AUDIT_DB_PATH"

      # ── Audit truthfulness & traceability ──────────────────────────────
      # A policy verdict of deny must never be written to the durable record as
      # outcome=success. This is the defect class that hid refusals behind a
      # green audit trail; it drives the real @kernel_action decorator against
      # the real policy engine and a real hash-chained store.
      - name: Verify a policy DENY is never recorded as outcome=success
        run: python scripts/verify_audit_truthfulness.py

      # The same lie, one layer up: identity.grant/revoke report a refusal by
      # `return False`, which the decorator cannot distinguish from success.
      - name: Verify identity grant/revoke refusals are audited as refusals
        run: python scripts/verify_identity_denial_audit.py

      # Traceability: the audit chain could prove "an action executed" but not
      # "this goal executed it". Proves kernel-action events carry the GOAL's
      # correlation id, not a fresh random one.
      - name: Verify goal -> action audit correlation id propagation
        run: python scripts/verify_audit_goal_correlation.py

      # The planner's task loop must run through the audited @kernel_action path
      # (ai.execute_planner_task) and its durable state must round-trip.
      - name: Verify the planner loop is audited and its state round-trips
        run: python scripts/verify_planner_audit_loop.py

      # ── Real execution honesty ─────────────────────────────────────────
      # Planner -> Execution -> Verify -> Audit, with a real file_write and a
      # real python_compute: proves the artifact and the audit record are real,
      # and that with no executor injected the kernel does NOT claim a run.
      - name: Verify planner->execution->verify->audit closes end-to-end honestly
        run: python scripts/verify_e2e_real_execution.py

      # Verifier.verify must re-check the filesystem itself, not trust the
      # executor's `{"written": path}` claim -- the anti-self-proving fix.
      - name: Verify the Verifier does not trust the executor's self-report
        run: python scripts/verify_execution_independent_verification.py

      # Production wiring path: the same capability executor the gateway
      # injects, plus P4 workspace-containment refusal on an escaping write.
      - name: Verify P6 real artifact creation and P4 workspace containment
        run: python scripts/verify_p6_e2e_file_creation.py

      # Real execution vs fail-closed, plus policy/resource denial truthfulness
      # and the mark_action_denied three-state mechanism.
      - name: Verify P6 real execution vs fail-closed honesty
        run: python scripts/verify_p6_real_execution.py

      # Full user-facing chain with no simulated-execution opt-in: a real
      # side effect, a real compute result, and an honest failure (never a
      # silent success) for a capability the system cannot serve.
      - name: Verify real-execution E2E honesty with no simulated opt-in
        run: python scripts/verify_real_execution_e2e.py

      # The single-writer fence must be armed without killing boot: it has to
      # survive in-process startup calls AND stay fail-closed for rogue
      # executors. Previously arming it made the gateway die on boot.
      - name: Verify the executor fence survives boot and stays fail-closed
        run: python scripts/verify_fence_boot_survival.py

      # What "armed" actually means, as executable fact rather than prose.
      # _fence_enabled_for() checks the env var BEFORE the allow-list, so an
      # empty _FENCE_ACTIONS does NOT mean "nothing is armed" -- that misreading
      # already produced one false claim. Conversely the fence provides
      # identity + audit + deny-without-context, and NOT mutual exclusion:
      # without LIUHAO_EXECUTOR_FENCE_MAX_EXECUTORS a second executor is
      # admitted. This gate pins both halves so neither claim can drift.
      - name: Verify executor-fence arming semantics and the exclusion boundary
        run: python scripts/verify_executor_fence_armed.py

      # ── User-facing surfaces ───────────────────────────────────────────
      # The audit mechanism was always real but no human could reach it.
      # Proves /v1/audit/* is served over real HTTP, filters by correlation_id,
      # reports ok=false on a tampered throwaway copy (not a stub that always
      # answers True), 401s without a token, and mounts no mutation route.
      - name: Verify the user-facing audit surface (query + tamper detection + 401)
        run: python scripts/verify_audit_user_surface.py

      # Same for identity: real principals surfaced honestly, empty-vs-unknown
      # distinguished (503 / warnings instead of a clean-looking empty list),
      # 401 without a token, and no mutation route under /v1/identity.
      - name: Verify the user-facing identity/permission surface
        run: python scripts/verify_identity_user_surface.py

      # Operational closure: a real user hands real work over real HTTP (real
      # uvicorn socket, real ASGI stack, real httpx client) and gets a real
      # result -- not an in-process shortcut.
      - name: Verify a real user gets a real result over real HTTP
        run: python scripts/verify_http_full_closure.py

      # ── AI Employee ────────────────────────────────────────────────────
      # The employee is a real worker bound to the loop: goal ownership, BUSY
      # -> IDLE, and a real cancellation (never faked as a success).
      - name: Verify AI Employee goal binding and real cancellation
        run: python scripts/verify_employee_goal_binding.py

      # EmployeeStore must survive a process restart (employees / agents /
      # tasks), with no network call.
      - name: Verify EmployeeStore survives a restart
        run: python scripts/verify_employee_persistence.py

      # The dashboard roster must surface persisted employees, not kernel /
      # layer modules dressed up as employees -- the "modules as staff" lie.
      - name: Verify the roster surfaces real employees, not modules
        run: python scripts/verify_roster_real_employees.py

      # Migration / rollback path. Wired only after it was proven to actually
      # run: with an interpreter that has alembic, this reaches revision 005,
      # downgrades to base leaving only alembic_version, and re-checks
      # persistence. It fails LOUDLY (never skips) when no alembic entry point
      # is resolvable, so a missing dependency reads as a missing dependency
      # instead of an alembic build defect. Needs the `alembic` installed above.
      - name: Verify schema upgrade and rollback really run
        run: python scripts/verify_deploy_readiness.py

  # Linting job
  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . flake8 bandit

      - name: Run Flake8
        run: python -m flake8 src/ --max-line-length=100 --select=E,F,W --ignore=E501,W503

      # Audit append performance / invariants gate.
      #
      # BLOCKING part: --invariants-only checks properties that hold on ANY
      # machine (no lost appends under concurrency, contiguous seq, chain
      # intact after a hard kill, chain verifies). Those are correctness, so
      # they must never regress regardless of hardware.
      #
      # NUMERIC gate (--gate against the profile-keyed baseline in
      # scripts/bench_baseline.json): events/sec is a property of the machine,
      # so the baseline is keyed by a machine/profile fingerprint (OS, Python
      # version, CPU, quick flag). When the current runner's profile does NOT
      # match the baseline, the numeric gate SKIPs -- it does not fail and does
      # not pretend to pass, it just asks for a re-baseline. When the profile
      # DOES match, a real regression blocks the build. This keeps CI numbers
      # honest instead of comparing a shared runner against a workstation.
      - name: Audit append invariants gate (blocking)
        run: python scripts/bench_audit_append.py --quick --invariants-only

      - name: Audit append throughput vs profile baseline (skip on mismatch)
        run: python scripts/bench_audit_append.py --quick --gate scripts/bench_baseline.json --tolerance 0.5

      # ⚠️ 采集用，非门禁：真正会阻断 CI 的 Bandit 门禁在 security job
      # （--severity-level high，命中即失败）。此处保留全量扫描 + artifact，
      # 供人工审查 MEDIUM/LOW，与 security job 的 HIGH 门禁互补。
      - name: Run Bandit
        run: python -m bandit -r src/ -f json -o bandit-results.json || true

      # ⚠️ artifact 名必须与 security job 的不同：upload-artifact@v4 不允许同一
      # workflow run 内出现两个同名 artifact，两个 job 并发上传同名会 409 冲突，
      # 谁失败取决于竞态 —— 属真实的 CI 抖动源。故此 job 用 -lint 后缀。
      - name: Upload Bandit Results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results-lint
          path: bandit-results.json
          if-no-files-found: ignore

      # Keep the ops audit scripts lint-clean so the readability gate itself
      # cannot silently break on a syntax/style regression.
      - name: Lint ops audit scripts
        run: |
          python -m py_compile scripts/ops/audit_console_readability.py scripts/ops/https_proxy.py
          python -m flake8 scripts/ops/audit_console_readability.py scripts/ops/https_proxy.py \
            --max-line-length=100 --select=E,F,W --ignore=E501,W503

  # Integration Tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    # 跟随**默认分支**而非硬编码 main：Round 78 已把默认分支切为
    # wip/liuhao-x-evolve，main 停在 2026-09-03（legacy 归档），
    # 硬编码 main 会让本作业**永久不运行**（= 声明了却零保护）。
    # 用 default_branch 可自愈：以后换默认分支不必再改这里。
    # 已知局限：pull_request 事件下 github.ref_name 不是分支名，故 PR 上仍不跑。
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Integration Tests
        run: |
          if [ -d tests/integration/ ]; then
            python -m pytest tests/integration/ -v --tb=short --no-header
          else
            echo "No integration tests directory found - skipping"
          fi

  # Smoke Test
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: integration
    # 跟随**默认分支**而非硬编码 main：Round 78 已把默认分支切为
    # wip/liuhao-x-evolve，main 停在 2026-09-03（legacy 归档），
    # 硬编码 main 会让本作业**永久不运行**（= 声明了却零保护）。
    # 用 default_branch 可自愈：以后换默认分支不必再改这里。
    # 已知局限：pull_request 事件下 github.ref_name 不是分支名，故 PR 上仍不跑。
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Quick Health Check
        run: python -c "from src.security import RBACManager, VaultTransitCrypto; from src.security.abac import ABACEngine; from src.security.rotation import KeyRotationManager, KeyType; from src.integrations.storage import StorageManager, Repository; from src.integrations.vault import VaultClient; from src.plugins.sandbox.backends import SandboxBackendManager; print('All modules load OK')"

  # Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Quick Import Check
        run: python -c "from src.security import RBACManager, VaultTransitCrypto, CryptoAuditLogger; from src.security.abac import ABACEngine; from src.security.rotation import KeyRotationManager, KeyType; from src.integrations.storage import StorageManager, Repository; from src.integrations.vault import VaultClient; from src.plugins.sandbox.backends import SandboxBackendManager; print('All major modules import successfully')"

      # The console (apps/console/console) was never built in CI, so a broken
      # TypeScript change could reach main unnoticed. Round 76 wires the
      # 审批中心 panel into the Policy endpoints; tsc is the only thing that
      # proves the client contract still type-checks against the JSON it reads.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/console/package-lock.json

      - name: Install console dependencies
        working-directory: apps/console/console
        run: npm ci

      - name: Type-check and build the console
        working-directory: apps/console/console
        run: npm run build

      - name: Lint the console
        working-directory: apps/console/console
        run: npm run lint

  # Architecture gate (Semgrep) —— 本仓库**唯一会阻断**的静态检查作业。
  #
  # 为什么需要它：上面 Security Scan 里的 Trivy / Bandit / pip-audit 全都是
  # `--exit-code 0` 或 `|| true`，意味着它们从不阻断任何一次推送 ——
  # "声明了检查" 与 "检查拦得住" 是两件事。本作业刻意严格：任何一条命中都失败。
  #
  # 为什么它敢严格：规则集 `.semgrep/liuhao.yml` 在当前代码树上**实测 0 命中**
  # 并由本作业持续钉住。做不到 0 命中的规则必须放进 advisory 而非这里 ——
  # 一个从第一天就红着的门禁，等于没有门禁。
  #
  # 许可证边界（重要，勿改）：Semgrep 自身是 **LGPL-2.1**。允许**以独立工具
  # 在 CI 进程里调用**（mere aggregation，不触发 copyleft）；**禁止** fork、
  # 内置或以任何形式放进鎏灏的分发物 —— 那会让我们的改动承担 LGPL 开源义务。
  # 因此 semgrep **不写进** pyproject/requirements（它不是运行时依赖，也不是
  # 测试依赖），只在 CI 这一步临时安装。
  architecture-gate:
    name: Architecture Gate (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      # 关键：必须带 --error，否则 semgrep 在命中时仍 exit 0，门禁形同虚设。
      # 实测：默认 exit 0（即便 4 条 blocking findings），加 --error 后命中即 exit 1。
      # 这里同时输出 SARIF 便于失败后在 Security 面板里定位。
      - name: Run Semgrep (blocking)
        run: |
          set -o pipefail
          semgrep --config .semgrep/liuhao.yml \
                  --metrics=off \
                  --disable-version-check \
                  --error \
                  --sarif --output semgrep-results.sarif \
                  src/ scripts/

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: ignore

  # Console readability / contrast audit — WCAG 2.1 AA regression gate.
  # Builds the Vite SPA, then starts the REAL gateway (uvicorn
  # src.gateway.main:app) on a LOOPBACK-ONLY port (127.0.0.1, never 0.0.0.0)
  # with an ephemeral demo credential + human identity, so the audit can
  # actually LOG IN and walk all 9 AUTHENTICATED pages (not just the login
  # screen). A REAL headless Chromium over CDP (3 client modes x 9 pages) is
  # driven via scripts/ops/audit_console_readability.py, and the job FAILS
  # when the script exits non-zero (any contrast violation or runtime error).
  # Loopback + fail-fast keeps this safe and hermetic. The demo seed uses the
  # public demo secret the audit script expects; it is written to $RUNNER_TEMP
  # and never committed.
  console-readability:
    name: Console Readability Audit (WCAG-AA)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json has no `engines` field; pin to 22 to match the Build
          # Verification job above.
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/console/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend deps
        working-directory: apps/console/console
        run: npm ci

      - name: Build console SPA
        working-directory: apps/console/console
        run: npm run build

      - name: Install Playwright Chromium (+ system deps)
        # Ad-hoc fetch of the playwright CLI via npx; --with-deps pulls the
        # shared libraries Chromium needs on ubuntu-latest.
        working-directory: apps/console/console
        run: npx playwright install --with-deps chromium

      - name: Locate Chromium binary
        id: chromium
        run: |
          # Playwright >=1.49 (Chrome for Testing) installs the full browser under
          # chrome-linux64/ (not chrome-linux/). Accept both layouts so the step is
          # deterministic regardless of which Playwright version `npx` resolves to.
          BIN=$(ls "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          test -n "$BIN" || { echo "::error ::playwright chromium binary not found"; exit 1; }

      - name: Install Python deps (gateway + audit)
        # The gateway is the package itself; install it editable like the other
        # Python jobs, plus websockets for the audit driver.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install websockets

      - name: Seed ephemeral demo credential + human identity
        # The audit logs into the REAL gateway and walks all 9 authenticated
        # pages, so CI must run the backend with a known principal. These seeds
        # are written to $RUNNER_TEMP (never committed) using the public demo
        # secret the audit script expects. The script self-verifies a real login.
        env:
          # With the fail-closed registry (HC-11 / U6) an unauthenticated row is
          # refused, so without this key the seeded CEO would be silently
          # dropped and the real login below would 401. It is a throwaway CI
          # value: nothing outside this job is protected by it.
          LIUHAO_HUMAN_IDENTITIES_INTEGRITY_KEY: ci-ephemeral-integrity-key
          LIUHAO_HUMAN_IDENTITIES_FILE: ${{ runner.temp }}/liuhao/human_identities.json
          LIUHAO_AUTH_SECRETS_FILE: ${{ runner.temp }}/liuhao/ci_auth_secrets.json
        run: |
          mkdir -p "${{ runner.temp }}/liuhao"
          python scripts/register_human_identity.py \
            --principal ceo \
            --display-name "CEO" \
            --password "Boss-Console-Demo-2026" \
            --file "${{ runner.temp }}/liuhao/human_identities.json" \
            --secrets-file "${{ runner.temp }}/liuhao/ci_auth_secrets.json"

      - name: Start gateway (loopback only — serves built SPA + auth API)
        env:
          LIUHAO_HUMAN_IDENTITIES_INTEGRITY_KEY: ci-ephemeral-integrity-key
          LIUHAO_HUMAN_IDENTITIES_FILE: ${{ runner.temp }}/liuhao/human_identities.json
          LIUHAO_AUTH_SECRETS_FILE: ${{ runner.temp }}/liuhao/ci_auth_secrets.json
          LIUHAO_CONSOLE_DIST: apps/console/console/dist
        run: |
          python -m uvicorn src.gateway.main:app --host 127.0.0.1 --port 8099 --log-level warning &
          echo $! > /tmp/gw.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8099/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS -X POST http://127.0.0.1:8099/v1/auth/login \
                -H "Content-Type: application/json" \
                -d '{"principal":"ceo","secret":"Boss-Console-Demo-2026","client":"web"}' >/dev/null 2>&1; then
            echo "::error ::gateway did not come up / demo login failed"
            kill "$(cat /tmp/gw.pid)" 2>/dev/null || true
            exit 1
          fi

      - name: Run readability audit (fails on WCAG-AA violation)
        env:
          LIUHAO_AUDIT_BASE: http://127.0.0.1:8099/
          LIUHAO_AUDIT_PRINCIPAL: ceo
          LIUHAO_AUDIT_SECRET: Boss-Console-Demo-2026
          LIUHAO_AUDIT_CDP_PORT: "9344"
          LIUHAO_AUDIT_BROWSER: ${{ steps.chromium.outputs.path }}
          LIUHAO_AUDIT_OUT: /tmp/audit-out
          LIUHAO_AUDIT_PROFILE: /tmp/cdp-profile
          # CI runner 上解除沙箱：ubuntu-latest 默认 unprivileged userns 受限，
          # Chrome 起不来即「无法连接 CDP」。本地默认不加（保持沙箱）。
          LIUHAO_AUDIT_NO_SANDBOX: "1"
        run: python scripts/ops/audit_console_readability.py

      - name: Stop gateway
        if: always()
        run: kill "$(cat /tmp/gw.pid)" 2>/dev/null || true

      - name: Upload audit screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-readability-screenshots
          path: /tmp/audit-out
          if-no-files-found: ignore

# Go/No-go gate: Only deploy when P0 gates pass.
# Actual image build + deploy is owned by ci-cd.yml (the CD pipeline),
# so ci.yml intentionally contains no deploy jobs to avoid duplicate
# deploy runs on every push.
  gate-check:
    name: P0 Gate Check
    runs-on: ubuntu-latest
    needs: [test, security, observability]
    # 跟随**默认分支**而非硬编码 main：Round 78 已把默认分支切为
    # wip/liuhao-x-evolve，main 停在 2026-09-03（legacy 归档），
    # 硬编码 main 会让本作业**永久不运行**（= 声明了却零保护）。
    # 用 default_branch 可自愈：以后换默认分支不必再改这里。
    # 已知局限：pull_request 事件下 github.ref_name 不是分支名，故 PR 上仍不跑。
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Check STAGING_DATABASE_URL
        run: |
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "::error ::STAGING_DATABASE_URL is not configured in GitHub Secrets"
            echo "P0 gate: FAIL - real staging DB required"
            exit 1
          else
            echo "P0 gate: PASS - STAGING_DATABASE_URL configured"
          fi
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}