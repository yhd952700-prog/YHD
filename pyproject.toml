[project]
name = "liuhao-ai-os"
version = "0.1.1"
description = "LiuHao AI OS (镭灏) - Y1 Implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    # 启动器 scripts/start_liuhao.py 用它把仓库根 .env 载入进程环境
    # （SECRET_KEY / APP_ENV 对网关可见），失败时回退到已导出的环境变量。
    # requirements.txt 早已锁进该包，这里补齐声明，避免"能 import 却未声明"。
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    # Windows 桌面集成（系统托盘）使用 pywin32 直接调用 Win32；
    # 仅 Windows 安装（Linux CI/Docker 不拉取），由 src/desktop/tray.py 平台限定加载。
    "pywin32>=306; sys_platform == 'win32'",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # hypothesis 驱动 Policy 执法链的属性测试（tests/test_policy_properties.py）。
    # 与 pytest 同理放在**运行期依赖**而非 dev 组：CI 的 test job 只执行
    # `pip install -e .`，dev 依赖不会安装，否则 CI 收集测试时 ModuleNotFoundError。
    "hypothesis>=6.100",
    "pyyaml>=6.0.1",
    "mem0ai>=2.0.20",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langfuse>=4.0.0",
    "arize-phoenix>=3.0.0",
    # MCP SDK：src/adapters/mcp/mcp_adapter.py 顶层 `from mcp.types import ...`，
    # 因此它是硬依赖，不是可选依赖。此前未在此声明，只靠
    # arize-phoenix → fastmcp-slim[client,server] → mcp 这条**受 extras 控制**的
    # 传递链"碰巧"带进来：上游一旦取消该 extra，或解析结果换档，模块就会 ImportError。
    #
    # 2026-11-05（阶段 B1）上界收到 2.x：适配层已改用 FastMCP，而
    # `fastmcp-slim[client,server]==4.0.3` 明确要求 `mcp>=2.0,<3.0`；requirements.txt
    # 锁定的也正是 mcp==2.1.1。⚠️ 本机 .venv 原为 mcp 1.29.0（由 CI 用的独立扫描器
    # semgrep 1.183.0 的 `mcp==1.29.0` 硬钉造成漂移），升级后 semgrep CLI 在本机
    # .venv 内会因 `import mcp.server.fastmcp` 失败；semgrep 不是本项目的声明依赖
    # （CI 的 architecture-gate 在**独立 job 独立环境**里 `pip install semgrep`），
    # 故不影响门禁。本地要用 semgrep 请装到独立环境（如 pipx）。
    "mcp>=2.0.0,<3.0.0",
    # FastMCP：MCP 适配层的客户端（stdio / streamable HTTP）与服务端实现。
    # Apache-2.0，已登记 oss-registry.yaml。必须显式声明：mcp_adapter.py 顶层
    # `from fastmcp import Client` / `from fastmcp.server import FastMCP`。
    # 版本钉死与 requirements.txt（fastmcp-slim==4.0.3）一致 —— 不钉会随 phoenix
    # 的 `<5,>=4` 约束漂到其它 4.x；也不能降到 3.x（phoenix 要求 >=4）。
    "fastmcp-slim[client,server]==4.0.3",
    "hvac>=2.0.0",
    "cryptography>=42.0.0",
    # kernel foundation（LiuHao-O/packages/kernel）显式依赖：
    # redis 是 config 里的必填项；qdrant-client 此前只靠传递依赖"碰巧可 import"。
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    # 异步引擎回归测试用 sqlite+aiosqlite 驱动；此前只靠 arize-phoenix /
    # langgraph-checkpoint-sqlite 传递带入，任一上游去掉它测试就会挂。
    "aiosqlite>=0.20.0",
    # RestrictedPython：受限执行面（src/plugins/sandbox/backends/restricted_python_backend.py）。
    # 放在**运行期依赖**而非 extras：tests/test_sandbox_restricted_python.py 会真起
    # 子进程验证安全探针，CI 的 test job 只执行 `pip install -e .`，
    # 若放进 extras 则 CI 上这些用例只能 skip —— 而跳过的绿比红更危险。
    # 成本可接受：189KiB 纯 Python，运行期零传递依赖。
    # 许可证 ZPL-2.1（OSI 批准、BSD 同类、无 copyleft 传染），已登记 oss-registry.yaml。
    "RestrictedPython>=8.0",
    # ---- 以下 4 个是 src/ 的**直接 import**，此前只靠上游传递依赖"碰巧可 import"。
    # 由 scripts/verify_dependency_declaration_surface.py 机械化守住：任何 src/ 里
    # 直接 import（含函数内 lazy import）却没在下面声明的第三方包，都会让该门禁变红。
    # 此前 mcp / qdrant-client / aiosqlite 已按同样理由补过；这 4 个是同一批漏网的。
    # 全部只设下界、不设上界，与 requirements.txt 现有锁定解析结果相容。
    #
    # requests：生产 webhook 告警投递面 src/observability/alerts/sinks.py 的
    #   `requests.post`，以及 src/ai/providers.py 的 5 处 provider 调用。此前只在
    #   requirements.txt 里被 hvac / langsmith / opentelemetry 传递带入 —— 生产
    #   投递面靠传递依赖是运气，不是声明。
    "requests>=2.28.0",
    # sqlalchemy：src/integrations/{orm_models,storage}.py 与 src/knowledge/db.py
    #   在**模块顶层** from sqlalchemy import ...（含 ext.asyncio / orm）。
    "sqlalchemy>=2.0.0",
    # starlette：src/gateway/console_static.py 顶层 from starlette.staticfiles /
    #   exceptions。它是 fastapi 的传递依赖，但本仓直接用其符号，应显式声明。
    "starlette>=0.36.3",
    # packaging：src/kernels/plugin/__init__.py 顶层 from packaging.version import
    #   Version/InvalidVersion（插件版本解析）。
    "packaging>=23.0",
    #
    # ---- 以下 4 个同样是直接 import，但**藏在函数体里**（含 try: 内的缩进块），
    # 所以初版扫描没看到。补上后 verify_dependency_declaration_surface.py 才会安静。
    #
    # pyjwt（import jwt）：src/security/jwt_handler.py —— 令牌签发/校验面。
    #   此前只靠 mcp → pyjwt 传递带入：一个安全边界依赖上游 SDK 的传递链，
    #   是这 4 个里最不该靠运气的一个。
    "pyjwt>=2.8.0",
    # langchain-core：src/ai/langgraph_workflow.py（messages / runnables）。
    #   已声明了 langchain / langchain-openai / langchain-community，但
    #   langchain-core 是本仓**直接 import** 的那个包。
    "langchain-core>=0.3.0",
    # psutil：src/observability/metrics.py（主机指标采集）。
    "psutil>=5.9.0",
    # pydantic-monty-client（import pydantic_monty）：
    #   src/plugins/sandbox/backends/monty_backend.py —— 受限执行后端。
    "pydantic-monty-client>=0.0.20",
    # taskiq：src/tasks/{broker,sqlite_broker,registry}.py 与 src/workers/*
    #   顶层 import（AsyncBroker / Receiver / LabelScheduleSource）。supervisor
    #   默认拉起 worker + scheduler，缺它队列整段不工作 => 运行期硬依赖。
    #   MIT，已登记 oss-registry.yaml；requirements.txt 锁定 0.13.0。
    #   只设下界：本仓用到的 AsyncBroker/kick/listen + AckableMessage 在 0.11+
    #   已稳定；上界留给上游（若未来破坏这些原语，测试会先红）。
    "taskiq>=0.11.0",
    # ---- 知识库文件导入（src/knowledge/extractors.py）----
    # pypdf：PDF 文本层提取 + 逐页页码。BSD-3-Clause（PyPI 元数据实测
    #   License-Expression，无 copyleft）。选择它而不是 pymupdf（AGPL，本项目
    #   明确禁止）、pdfminer.six / pdfplumber（MIT 但更低层/额外拉影像依赖）：
    #   纯 Python、无需系统 poppler 二进制、逐页 API 稳定、有 is_encrypted /
    #   decrypt 与可映射的类型化错误。
    # python-docx：DOCX 正文与段落 **样式名**（Heading 1..6），正好是结构化
    #   分块需要的标题层级。MIT（包元数据实测 License）。docx2txt 会丢层级，
    #   mammoth 转 HTML 并引入额外依赖。其传递依赖 lxml 为 BSD-3-Clause。
    # HTML 走标准库 html.parser，不新增第三方依赖，因此不增加许可证面。
    # 三者均已登记 oss-registry.yaml；requirements.txt 已锁定实测版本。
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

# 测试/验证专用依赖（不进运行期依赖，避免 lupa 这种需要编译的扩展拖慢/拖垮
# 生产安装）。CI 必须 `pip install -e .[tests]` 才会装上它们，从而让
# tests/distribution/test_coordination.py 里的 `TestRedisLuaScriptsActuallyExecute`
# （fakeredis + lupa 真跑 Lua）从"skip"变成"真验证"。缺 lupa 时该组在测试内优雅
# skip（nodes fixture 的 eval 自检），不会把安装/收集搞挂。
#
# pytest-timeout 同理进 [tests]（不进运行期依赖）：scripts/verify_readiness.py 的
# C3(--full：`pytest tests/ --timeout=60`) 与 C6(`--timeout=120`) 靠它给单测/混沌
# 套件加挂起保护。它是 release-readiness CI 的运行期门禁依赖 —— 该 job 跑
# `verify_readiness.py --full` 前先 `pip install -e .[tests]`，缺它时 pytest 报
# `error: unrecognized arguments: --timeout` ⇒ rc=4 ⇒ C3/C6 根本无法执行。此前本机
# 恰好装了、却从未出现在任何声明面，属依赖声明面缺失（见 #383）。
[project.optional-dependencies]
tests = [
    "fakeredis>=2.0.0",
    "lupa>=2.0",
    "pytest-timeout>=2.3.0",
]
# 第三个协调后端（etcd）：**不需要额外的 pip 包**。实现走 etcd v3 的 HTTP/JSON
# gateway（src/distribution/coordination.py 的 _EtcdHttpAdapter，复用运行期已声明的
# requests），所以这里刻意**不设 [etcd] extra**。原先声明的 etcd3>=0.12.0 已移除：
# 它自带 protoc 3.x 生成的 _pb2.py，在 protobuf>=4（CI 解析到 6.x）上一 import 就抛
# "TypeError: Descriptors cannot be created directly"；降级 protobuf 或改用纯 Python
# 实现都会伤到其它依赖，因此从客户端这一侧彻底去掉 protobuf 依赖。
# scripts/verify_deployed_product_closure.py 的浏览器后端。**可选**，且不进运行期
# 依赖：这个门禁跑在**宿主/CI runner** 上（它驱动浏览器去访问已部署的栈），
# 进运行期依赖会把生产镜像和每个 CI job 的安装都拖垮。此前 playwright/selenium
# 完全没出现在任何声明面 —— 门禁 :193 `from playwright.sync_api import ...`
# 只能靠"碰巧装了"才跑得起来，属于依赖声明面缺失（见 UNVERIFIED #4-a）。
# 装上后仍需一个浏览器二进制：playwright 自带 chromium（`playwright install
# chromium`），或用 --browser-binary / $LIUHAO_BROWSER_BINARY 指定系统 chromium。
deploy-closure = [
    "playwright>=1.44",
    "selenium>=4.20",
]
# scripts/ops/audit_console_readability.py 的 WebSocket 客户端（读审计控制台
# 实时事件流）。**可选**：这条运维脚本把 websockets 当可选导入（缺了就打印
# 安装提示），此前只在 requirements.txt 里被 uvicorn/fastapi 传递带进来
# （"装了但没声明"），属于依赖声明面缺失（任务①「装了但没声明」一类）。
ops = [
    "websockets>=12.0",
]
# 密码散列与 TOTP 的强实现。**可选**（惰性 import + 优雅降级）：
# src/security/encryption.py 的 argon2/bcrypt 主路径缺失时退到 PBKDF2-SHA256，
# src/security/authentication.py 的 pyotp 缺失时退到手写 HMAC-SHA1 TOTP。
# 兜底让开发机不装也能跑，但"装没装"必须是声明过的选择而不是环境运气 ——
# 生产部署想要 argon2id / RFC 6238 真实现时显式 `pip install -e .[security]`。
security = [
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
]
# src/ai/providers.py `GoogleProvider.generate()` 惰性导入 `google.genai`
# （google-genai 新 SDK）。旧版 `google-generativeai` 已从依赖面移除：它把
# `protobuf<6` 钉死，与随包实装的 protobuf 6.x（googleapis-common-protos 要求）
# 直接冲突，安装期即 ResolutionImpossible。google-genai 自身不依赖 protobuf。
google = [
    "google-genai>=2.22.0",
]
# 数据库迁移工具 alembic。**可选**，且不进运行期依赖：全仓唯一消费者是
# scripts/verify_deploy_readiness.py（迁移入口探测），src/ 下**没有任何模块**
# import alembic（实测 grep：只有两处注释提到 migration），把它塞进运行期依赖
# 会白白加重生产镜像和每个 CI job。
#
# 此前它**只**出现在 requirements.txt:15（alembic==1.19.2），而 CI 走
# `pip install -e .[tests]` 根本不读 requirements.txt，于是 ci.yml 里有两处
# 裸 `pip install alembic sqlalchemy` 兜底（不钉版本）。这是一个**脆弱契约**：
# 声明面说没有这个依赖，真正在用它的人靠"记得手写一行 pip install"活着 ——
# 任何新增需要 alembic 的 job 漏写那一行就会静默降级或失败，且报出来的错
# （"No module named alembic.__main__"）看起来像 alembic 本身坏了，见
# scripts/verify_deploy_readiness.py:111-137 那段探测注释。
#
# 版本：只设下界 1.19.2（与 requirements.txt 已锁定的解析结果相容；本机 .venv
# 实测 1.20.0 同样满足）。刻意不钉上界 —— 钉死会在上游发新版时制造假红。
# sqlalchemy 不需要在这里重复声明：它已是运行期依赖。
migrations = [
    "alembic>=1.19.2",
]
# Redis 任务队列后端（**可选，默认关闭**）：默认 broker 是本地 SQLite
# （src/tasks/sqlite_broker.py，不需要 Redis/Postgres）。只有显式设置
# LIUHAO_TASK_BROKER=redis 时才需要此 extra；未安装时 build_broker() 抛
# 明确错误而不是静默降级。taskiq-redis 1.1.0 要求 redis>=6,<7。
taskiq-redis = [
    "taskiq-redis>=1.1.0",
]
# DBOS pilot（**可选，默认关闭**）：只做「杀进程重启续跑」验证
# （src/resilience/dbos_pilot.py，见其模块文档）。dbos 3.4.0 的
# psycopg[binary] 是硬 pip 依赖，但 SQLite system database 模式不需要
# Postgres 服务，App 有 aiosqlite，本地可跑通。不放进运行期依赖：
# 不为一个试点拖慢生产安装。
dbos = [
    "dbos>=3.4.0,<4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# arize_phoenix_client 注册的 pytest11 插件（入口名 phoenix）会 import
# phoenix.trace.dsl，在 pydantic>=2.13 下抛 ValueError（mutable default），
# 导致 pytest 在收集用例之前就崩溃 —— 表现为「零用例执行」的假失败。
# 本项目不依赖该插件的断言能力，统一禁用；插件未安装时 -p no: 静默生效。
addopts = "-p no:phoenix"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests (require external services)",
    "e2e: end-to-end tests",
    "security: security-focused tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "T20", "SIM", "PIE", "ICN"]
ignore = ["E501", "SIM102", "SIM103", "SIM113", "SIM115", "T201", "T203", "B008", "B009", "C408", "ICN001"]

[tool.uv]
dev-dependencies = [
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
