version: '3.8'

services:
  redis-master-1:
    image: redis:7-alpine
    container_name: liuhao-redis-master-1
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-liuhao_dev_redis_pass} --maxmemory 2gb --maxmemory-policy allkeys-lru --cluster-enabled yes --cluster-config-file nodes.conf
    volumes:
      - redis-master-1-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - liuhao-network

