# Redis Cluster Configuration for liuhao AI OS
port 6379
cluster-enabled yes
cluster-node-timeout 5000
cluster-config-file nodes.conf
appendonly yes
appendfsync everysec
save 60 1024
appendonly no

# Security
requirepass liuhao_redis_pass_2024

# Memory policy
maxmemory 2gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile "redis.log"

# Maxclients for cluster
maxclients 10000

# Replication - 3 masters + 3 replicas
