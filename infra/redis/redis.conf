# Redis Cluster Configuration for liuhao AI OS
port 6379
cluster-enabled yes
cluster-node-timeout 5000
cluster-config-file nodes.conf
appendonly yes
appendfsync everysec
save 60 1024

# Security
# 密码勿硬编码：由 docker-compose 的 `--requirepass ${REDIS_PASSWORD}` 注入
# （开发默认值见 .env.example；生产必须通过环境变量设置强密码）。
# requirepass <从环境变量注入>

# Memory policy
maxmemory 2gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile "redis.log"

# Maxclients for cluster
maxclients 10000

# Replication - 3 masters + 3 replicas
