version: '3.8'

services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: liuhao-postgres-primary
    environment:
      POSTGRES_DB: liuhao_ai_os
      POSTGRES_USER: liuhao
      POSTGRES_PASSWORD: liuhao_secure_pass_2024
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liuhao -d liuhao_ai_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - liuhao-network

  postgres-replica:
    image: postgres:15-alpine
    container_name: liuhao-postgres-replica
    environment:
      POSTGRES_DB: liuhao_ai_os
      POSTGRES_USER: liuhao
      POSTGRES_PASSWORD: liuhao_secure_pass_2024
    command: ["postgres", "-c", "primary_conninfo='host=liuhao-postgres-primary port=5432 user=liuhao password=liuhao_secure_pass_2024 application_name=liuhao-replica'", "-c", "replication=database", "-c", "hot_standby=on"]
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liuhao -d liuhao_ai_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - liuhao-network

volumes:
  postgres-primary-data:
  postgres-replica-data:

networks:
  liuhao-network:
    driver: bridge
