[package]
name = "liuhao-sdk"
version = "0.1.0"
edition = "2021"
authors = ["LiuHao Team <team@liuhao.ai>"]
description = "Official Rust SDK for the LiuHao AI OS platform"
license = "MIT"
readme = "README.md"
repository = "https://github.com/liuhao-ai/liuhao-os"
categories = ["api-bindings", "asynchronous", "web-programming"]
keywords = ["liuhao", "ai", "agent", "sdk", "api"]

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
url = "2.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.5"
