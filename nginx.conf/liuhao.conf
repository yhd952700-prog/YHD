# 鎏灏 AI OS — Nginx 反向代理站点配置
#
# 挂载到 nginx 官方镜像的 /etc/nginx/conf.d/default.conf。
# 将外部请求反代到 FastAPI 网关（docker-compose 服务名 api:8080），
# 并针对 SSE 流式对话做专项处理（关闭缓冲 + 延长读超时）。

upstream liuhao_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16m;

    # 健康探针
    location = /v1/health {
        proxy_pass http://liuhao_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 就绪探针
    location = /v1/ready {
        proxy_pass http://liuhao_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 流式对话：关闭缓冲（逐 token 即时推送）+ 延长超时
    # （CPU 推理单轮可达十几秒，300s 足够）。
    location = /v1/chat/stream {
        proxy_pass http://liuhao_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余 API（/v1/chat、/docs、/openapi.json、/knowledge/*）
    location / {
        proxy_pass http://liuhao_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
