  # --- library / staged code (no consumer yet; not a defect) ----------------
  - module: src.gateway.validation
    classification: library-staged
    reason: >-
      8 request-validation helpers. Not referenced: the gateway validates via
      pydantic request models declared inline on its routes.

  - module: src.logging_config
    classification: library-staged
    reason: >-
      Logging setup helper with zero importers. Runtime logging is configured
      without an explicit setup_logging()/dictConfig() call site (verified in
      src/gateway/main.py, main.py, serve.py). Coexists with the equally
      unwired src/observability/logging_utils.py.

  - module: src.observability.logging_utils
    classification: library-staged
    reason: >-
      Structured-logging helpers (correlation ids, structlog bridge) with zero
      importers. Same situation as src/logging_config.py -- two unwired logging
      modules; neither is currently the configured path.

  - module: src.observability.alerts
    classification: library-staged
    reason: >-
      Alert definition module with a single public function and no consumer.
      Prometheus metrics are exposed live (src/observability/production.py), but
      no alert rules are wired to them yet.

  - module: src.pipelines.etl
    classification: library-staged
    reason: >-
      ETL pipeline (4 classes, 11 methods) with no consumer. Staged ingestion
      capability; not on any runtime path.

  - module: src.pipelines.parser
    classification: library-staged
    reason: >-
      Document parser (4 classes, 9 methods) with no consumer. Staged ingestion
      capability; not on any runtime path.

  - module: src.plugins.marketplace
    classification: library-staged
    reason: >-
      Plugin marketplace store (register/get/list). No consumer; the plugin
      kernel (src/kernels/plugin) is the live plugin path.

  - module: src.plugins.plugin_manager
    classification: library-staged
    reason: >-
      Plugin manager with container-sandbox integration notes. No consumer; the
      live plugin authority is src/kernels/plugin.

  # --- tooling and non-runtime artifacts ------------------------------------
  - module: src.performance.benchmarks
    classification: tooling
    reason: >-
      Benchmark harness meant to be invoked manually, not imported by the app;
      this is why it has no importer. NOTE: it consumes LRUCache from
      src/performance/cache.py, so a human run must stay green (the Phase 8
      cache work kept this in mind).

  - module: src.infra.infra_charts
    classification: infra-artifact
    reason: >-
      Emits Helm chart text; it is a generator of non-runtime artifacts, not
      application code. The only textual match is inside the module itself.

  # --- legacy ---------------------------------------------------------------
  - module: src.adapters.observability.opentelemetry_adapter
    classification: legacy-not-wired
    reason: >-
      Module docstring already self-declares "[LEGACY / NOT WIRED]". Real
      OpenTelemetry export remains a Phase 7 leftover; nothing consumes it.

