# 鎏灏全球开源生态吸收 —— 覆盖蓝图（72 类 → 可执行查询 → 目标内核 → 基因归类）
#
# 本文件回答一个问题：**用户列的 72 类，到底哪些能真正增强鎏灏？**
#
# 工程口径（重要）：
#   用户的 72 类里，"类"有两种不同性质，处理方式必须区分：
#     A. **平台类**（GitHub / PyPI / HF / CNCF...）→ 有 API 端点，写在 sources.yaml
#     B. **生态主题类**（React 生态 / ROS / ClickHouse...）→ 没有独立 API，
#        本质是**跑在平台类之上的查询意图**。所以它们落在这里，作为 queries。
#   混淆这两者会导致"给每个生态写一个爬虫"这种荒谬设计。
#
# 字段：
#   id             稳定标识（沿用用户清单编号，便于逐条对照）
#   group          所属大组
#   kind           platform(需真探活) / topic(查询意图) / horizon(仅跟踪、不扫描不吸收)
#   priority       P0 = 直接补内核缺口，优先评估
#                  P1 = 外围增强，值得吸收但可延后
#                  P2 = 与本产品无关或重复 → **必须显式标注理由，不得沉默跳过**
#   queries        注入各源 discover.params.{query} 的搜索词
#   sources        执行这些查询要走哪些平台源（必须是 sources.yaml 中已存在且 discover 非 null 的 id）
#   target_kernels 命中后增强哪个内核（对齐 KERNEL-CANON 的 14 个）
#   gene           归入《开源能力基因库》的哪一类（genebank 的 12 类）
#   liuhao_gap     鎏灏当前在这个方向上具体缺什么 —— **这是"吸收"是否成立的唯一判据**
#
# 诚实约束：若某条 liuhao_gap 说不出具体缺口，说明它不该是 P0。
#  2026-09-13 首版。

