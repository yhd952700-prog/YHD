# 《鎏灏全球开源能力数据库》—— 安全能力（权限策略 + 代码扫描）
# 对应基因：safety-capability
# 缺口（来自 genebank/GENE-MAP.yaml）：
#   1) Network 内核改为真实投递后，**出向管控成为新的空白**；
#   2) [✅ 2026-09-15 已闭环] Bandit 早就跑过，缺的一直是「必跑」；
#      现已升为 CI 里的**阻断门禁**（security job，`--severity-level high` 命中即红）。
#   3) Policy 内核为自研 ABAC，需要业界对照物来审视自身完备度。
#
# 数据来源：scan-20260913T203529Z.json intent=57/58 + api.github.com/repos/<repo> 二次核实
