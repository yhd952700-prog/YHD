  - name: RestrictedPython
    source: PyPI
    source_platform: pypi
    url: https://pypi.org/project/RestrictedPython/
    id: LHX-OSS-0035
    verdict: adopt
    adoption_decision: adopt
    decision_note: "已落地为受限执行后端，实测编译期拦截 import/eval/dunder、CPU 3s 超时由子进程 kill 生效（3052ms 被终止）；定位是能力隔离而非资源隔离（内存上限明确不做），作为 AI 生成代码的受限第二执行面。"
    license: ZPL-2.1
    license_class: weak-copyleft
    enhances_liuhao: "yes"
    function: "以受限 Python 解释器在编译期禁用 import/eval/危险属性访问，作为 AI 生成代码的受限第二执行面（能力隔离层）。"
    technical_value: "在 AST 编译阶段拒绝 import 语句、eval/exec 与 dunder 属性访问（__ 开头），使受限代码触发 ImportError/NameError/AttributeError 而非执行；open 因名字在受限命名空间不可达被拒；CPU 超时由外层子进程 kill 兜底（实测 3s 超时生效，3052ms 被终止）。"
    absorbable: "编译期名字过滤机制（限制 __builtins__ 与属性访问的守卫），不是整个解释器"
    needs_refactor: "light"
    integration_plan: "作为 execution/security 内核的受限执行后端，接入 sandbox manager 的 select_backend 接缝（与 Monty 后端同构，沿用 required=True 不可用时诚实失败）；回滚即注销该后端注册。"
    commercial_risk: "low —— ZPL-2.1 弱 copyleft，允许分发无商业限制条款；未做 CVE 扫描，待测。"
    security_risk: "medium —— 仅做能力隔离（编译期禁 import/eval/dunder），资源隔离（内存上限）明确不做，[0]*10**6 会真的分配成功，存在内存耗尽面；未做 CVE 扫描，待测。"
    performance_impact: "待测 —— 实测 CPU 3s 超时由子进程 kill 生效（3052ms 被终止）；内存分配未拦截，无量化基准。"
    solves: 给 AI 生成代码提供一个受限的第二执行面（编译期拦截危险结构），与容器/子进程路线互补，定位为能力隔离层。
    landed_in:
      - src/plugins/sandbox/backends/restricted_python_backend.py（新增，受限执行后端）
      - src/plugins/sandbox/backends/manager.py（注册 RestrictedPython 后端，沿用 required=True）
    acceptance: >-
      编译期实测禁 import/eval/dunder 属性访问；open 因名字不可达被拒；
      CPU 超时 3s 由子进程 kill 生效（3052ms 被终止）；
      内存上限明确不做——[0]*10**6 会真的分配成功，故 bytearray 失败只是名字过滤的副作用，不是内存保护。
    limits_honest: >-
      定位是「能力隔离，不是资源隔离」：内存上限明确不做，资源耗尽面需由外层配额/子进程约束兜底。

