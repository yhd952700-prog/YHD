  - name: 既有代码中的谎报成功（本轮顺带消除 4 处）
    source: 本仓库
    source_platform: github
    url: "internal://repo/LiuHao-AI-OS（本仓库内部整改，无外链）"
    id: LHX-OSS-0034
    verdict: remediated
    adoption_decision: adopt
    decision_note: "4 处修复已随本轮提交落地并通过各自测试，是已采纳的内部质量整改而非外部能力选型。"
    license: "内部代码（非 OSS，属本仓自有实现）"
    enhances_liuhao: "yes"
    function: "顺带修复本仓既有 4 处谎报成功：ShellAdapter 命令注入面改 argv、vault_crypto.ensure_key 真假成功、gVisor/Kata 空壳恒成功、select_backend 静默降级到全权限后端。"
    technical_value: "把 4 处「接口报告成功、实际什么也没做」的静默谎报改成诚实失败语义：ShellAdapter 默认 shell=False(argv)；ensure_key 必须 read_key 读到才返回 True；gVisor/Kata 空壳改 exit_code 127 + executed=False；select_backend 指定受限后端不可用时加 required=True 抛错而非降级。"
    absorbable: "无需吸收外部模块 —— 修补对象为本仓既有代码自身"
    needs_refactor: "none"
    integration_plan: "均已落地：src/ai/world_interface.py、src/security/vault_crypto.py、src/plugins/sandbox/models.py、src/plugins/sandbox/backends/manager.py；回滚即 revert 上述文件。"
    commercial_risk: "low —— 修补自有代码，无第三方许可风险。"
    security_risk: "low —— 修复提升了安全性（消除命令注入面与谎报成功）；本仓代码未做独立 CVE 扫描。"
    performance_impact: "待测 —— 改动为逻辑语义修正，预期无显著开销；未做基准实测。"
    findings:
      - file: src/ai/world_interface.py（ShellAdapter.execute）
        problem: >-
          把上层传入的字符串直接 `subprocess.run(..., shell=True)` ——
          autonomous 场景下 command 来自决策层，是真实的命令注入面。
        # 注意：含 `": "` 的值必须加引号，否则 YAML 当成嵌套映射 —— 本文件已踩到过
        fix: '默认改 argv（shlex 分词、shell=False）；shell 需显式 {"shell": True}'
        note: 这是本轮安全上最重要的一条修复。
      - file: src/security/vault_crypto.py（ensure_key）
        problem: except Exception 后无条件 `return True`，把 Vault 宕机/权限不足静默成成功
        fix: 只有在 read_key 真的读到该 key 时才返回 True，否则返回 False + error 日志
      - file: src/plugins/sandbox/models.py（gVisorBackend / KataBackend）
        problem: '恒返回 {"stdout":"","stderr":"","exit_code":0} —— 空壳恒成功，
                 连带 PluginManager.execute_plugin_action() 永远报告成功'
        fix: 改为 exit_code=127 + executed=False + 说明了原因的 stderr；
             create_backend 对未知类型抛 ValueError（不再静默兜成 gVisor）
      - file: src/plugins/sandbox/backends/manager.py（select_backend）
        problem: 显式指定后端不可用时静默降级到更弱后端
        fix: 新增 required 参数；并在 _init_backends 里不再用 None 掩盖 Monty 的失败原因
    how_it_was_caught: >-
      Semgrep 规则集写好后第一次跑就全部咬出来 —— 这条正好证明 S3 的门禁有价值：
      它产出的是一个可行的安全/质量治理工具，而不是一批漂亮的 YAML。

