        归属：只能读自己或自己子树内的实体；其他主体（含不存在的用户名）一律

        与"资源不存在"同一个中性 404 —— 否则本接口就是一个可枚举任意用户是否

        存在的预言机。``stats`` 是全局统计，只对管理员返回。'
