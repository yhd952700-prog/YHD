  /v1/events/history:
    get:
      description: '持久事件历史（只读，来自审计库）。


        与 ``/v1/events`` 的区别：那个读内存环形缓冲，只覆盖"本进程运行期间"；

        这里读审计库 ``audit_events``，覆盖"这个部署写过的全部事件"。两个都有

        存在的理由，但只有后者能回答"昨天发生了什么"。


        读库失败时返回 503 与真实原因 —— **绝不**返回空列表，否则调用方分不清

        "没有历史"和"历史读不出来"。


        非 ``L0`` 调用者的 ``principal`` 被强制为令牌主体；显式查询别人 → 403。'
