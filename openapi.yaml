  /v1/goals/{goal_id}/tasks/{task_id}/retry:
    post:
      description: "只重跑一个失败任务，其余任务的结果原样保留，并记录审计。\n\n只允许重试**自己的**任务；别人的目标（以及不存在的目标）统一 404，\n文案相同 —— 不暴露存在与否。\n\
        \n明确拒绝的情况（都有稳定 ``code``）：\n* ``goal_not_found`` / ``task_not_found`` — 目标或任务不存在（404）；\n* ``goal_running``\
        \ — 目标还在跑，等结束再重试（409）；\n* ``task_not_retryable`` — 该任务不是 ``failed``（例如已成功），\n  绝不顺带重跑其它任务（409）。"
