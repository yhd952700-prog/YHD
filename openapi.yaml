  /v1/accounts/self-register:
    post:
      description: '自助注册：用户名 + 密码即可，无需邀请码、无需主账号批准。


        * 上级恒为本机根账号的第 1 层（不接受请求体里的父子/深度字段）；

        * 作用域恒为最小集合（不能建下级、不能授权、不能借 Key）；

        * 主账号关闭开关后返回结构化拒绝 ``ACCOUNT_SELF_REGISTER_DISABLED``。


        恢复码：自助注册的账号没有管理员可代发激活码，因此与根账号一样**当场**

        签发一枚恢复码（库中只存 sha256，明文只出现在本次响应里）。签发失败

        不回滚已经建好的账号（用户会误以为没建成功并重试同名 → 409），而是

        如实返回空码并指路「我的 → 恢复码」补发。'
      operationId: self_register_v1_accounts_self_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfRegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Self Register V1 Accounts Self Register Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Self Register
      tags:
      - accounts
