        \  是人触发的执行面，需 Boss 授权；LLM 不能直接调包）。\n\n两栏共用同一张能力名（``capability``）：MCP 适配层按 capability 把\n聊天工具反向暴露出去，见\
        \ ``src/adapters/mcp/mcp_adapter.py``。"
