      - description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
        in: query
        name: correlation_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
          title: Correlation Id
      - description: 起始 Unix 时间戳（秒，含）
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: 起始 Unix 时间戳（秒，含）
          title: Since
      - description: 结束 Unix 时间戳（秒，含）
        in: query
        name: until
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
