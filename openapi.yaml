components:
  schemas:
    ApprovalRequest:
      description: '审批凭据签发请求。


        注意：**没有** ``principal`` 字段 —— 主体只能来自身份令牌。


        ``target`` 是**必填**的：授权的最小单位是 (principal, action, target)，

        缺省 target 不能解释成"任意 target"，否则一份只为一台资源签发的批准会

        静默覆盖全部资源。要授权全部 target，必须显式传 ``target="*"`` **并且**

        ``confirm_wildcard=True``（二次确认）。'
      properties:
        actions:
          description: 被授权的内核动作名（HIGH/CRITICAL）
          items:
            type: string
          minItems: 1
          title: Actions
          type: array
        confirm_wildcard:
          default: false
          description: 把 target 设为 '*' 时的二次确认。仅为全目标授权时需要；默认 false，此时通配会被拒绝。
          title: Confirm Wildcard
          type: boolean
        reason:
          default: ''
          description: 授权理由（记入审计）
          maxLength: 500
          title: Reason
          type: string
        target:
          description: 被授权的具体 target（资源标识）。必填；授权仅对该 target 生效。授权全部 target 需显式写 '*' 并同时置 confirm_wildcard=true。
          minLength: 1
          title: Target
          type: string
        ttl_seconds:
          default: 300.0
          description: 有效期秒数，上限 3600
          exclusiveMinimum: 0.0
          maximum: 3600.0
          title: Ttl Seconds
          type: number
      required:
      - actions
      - target
      title: ApprovalRequest
      type: object
    ChatRequest:
      properties:
        message:
          description: 用户消息
          minLength: 1
          title: Message
          type: string
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          default: default
          description: 会话 ID（多轮独立）
          title: Session Id
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 用户 ID（同用户跨会话共享画像）
          title: User Id
      required:
      - message
      title: ChatRequest
      type: object
    ChatResponse:
      properties:
        agent:
          title: Agent
          type: string
        correlation_id:
          title: Correlation Id
          type: string
        reply:
          title: Reply
          type: string
        status:
          title: Status
          type: string
        turn:
          title: Turn
          type: integer
      required:
      - reply
      - status
      - turn
      - correlation_id
      - agent
      title: ChatResponse
      type: object
    GoalCreateRequest:
      description: 创建+执行 Goal 的请求体。
      properties:
        background:
          default: false
          description: 'true: return immediately with state=''running'' and execute on a background thread,
            so GET /v1/goals/{id} can be polled and POST /v1/goals/{id}/stop can really cancel the run.
            false (default): execute synchronously and return the terminal state.'
          title: Background
          type: boolean
        natural_language:
          description: 自然语言目标描述
          maxLength: 2000
          minLength: 1
          title: Natural Language
          type: string
        plan_mode:
          default: auto
          description: '计划模式: auto/manual'
          title: Plan Mode
          type: string
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 可选：归属的项目 id（必须已存在，否则 404）
          title: Project Id
        scope:
          default: L1
          description: 执行范围 L0-L7
          title: Scope
          type: string
        verification_criteria:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 可选验证标准
          title: Verification Criteria
      required:
      - natural_language
      title: GoalCreateRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HireEmployeeRequest:
      description: 按名雇佣一个新 AI Employee 的请求体。
      properties:
        agent_count:
          default: 3
          description: agent 数量
          maximum: 64.0
          minimum: 1.0
          title: Agent Count
          type: integer
        agent_types:
          description: agent 类型列表（长度不足时按末位补齐）
          items:
            type: string
          title: Agent Types
          type: array
        name:
          description: 员工名（唯一键，全局不可重复）
          maxLength: 128
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: HireEmployeeRequest
      type: object
    LoginRequest:
      properties:
        client:
          default: web
          description: desktop | web | mobile
          maxLength: 16
          title: Client
          type: string
        principal:
          description: 登录主体
          maxLength: 128
          minLength: 1
          title: Principal
          type: string
        secret:
          description: 凭据
          maxLength: 512
          minLength: 1
          title: Secret
          type: string
      required:
      - principal
      - secret
      title: LoginRequest
      type: object
    ProfileUpdate:
      description: 画像写入请求：所有字段可选，只写传了的项。
      properties:
        behavior_pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Behavior Pattern
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 称呼
          title: Display Name
        expertise:
          anyOf:
          - type: string
          - type: 'null'
          title: Expertise
        fact:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 单条事实 {key, value}
          title: Fact
        interest:
          anyOf:
          - type: string
          - type: 'null'
          title: Interest
        preference:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: 单条偏好 {key, value, confidence?}
          title: Preference
        principal:
          anyOf:
          - type: string
          - type: 'null'
          description: 画像主体（不传 user_id 时使用）
          title: Principal
        relationship:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: 关系 {who, relation}
          title: Relationship
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 用户 ID（优先，主体 user-{id}）
          title: User Id
      title: ProfileUpdate
      type: object
    ProjectCreateRequest:
      description: 创建项目的请求体。
      properties:
        description:
          default: ''
          description: 项目描述
          maxLength: 2000
          title: Description
          type: string
        name:
          description: 项目名称
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: ProjectCreateRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
