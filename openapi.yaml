          title: Owner
          type: string
      required:
      - name
      title: AdoptEmployeeRequest
      type: object
    ApplyRequest:
      properties:
        confirm:
          default: false
          description: 必须为 true；缺少时返回 400，防止误触升级。
          title: Confirm
          type: boolean
        mode:
          anyOf:
          - type: string
          - type: 'null'
          description: 缺省=synchronous（只装不重启，保持原语义）；orchestrated=写请求文件并返回 202，由独立 supervisor 停服、安装、重启并做健康复核。
          title: Mode
        version:
          anyOf:
          - type: string
          - type: 'null'
          description: 必须明确指定要安装的版本号；与当前可升级版本不一致时返回 400。
          title: Version
      title: ApplyRequest
      type: object
    ApprovalRejection:
      description: 审批拒绝请求。理由可为空，但字段固定存在并写进审计。
      properties:
        pending_id:
          description: 待处理条目 id（pending:<seq>）
          maxLength: 64
          minLength: 1
          title: Pending Id
          type: string
        reason:
          default: ''
          description: 拒绝理由（可留空，记入审计）
          maxLength: 500
          title: Reason
          type: string
      required:
      - pending_id
      title: ApprovalRejection
      type: object
    ApprovalRequest:
      description: '审批凭据签发请求。


        注意：**没有** ``principal`` 字段 —— 主体只能来自身份令牌。


        ``target`` 是**必填**的：授权的最小单位是 (principal, action, target)，

        缺省 target 不能解释成"任意 target"，否则一份只为一台资源签发的批准会

        静默覆盖全部资源。要授权全部 target，必须显式传 ``target="*"`` **并且**

        ``confirm_wildcard=True``（二次确认）。'
      properties:
        actions:
          description: 被授权的内核动作名（HIGH/CRITICAL）
          items:
            type: string
          minItems: 1
          title: Actions
          type: array
        confirm_wildcard:
          default: false
          description: 把 target 设为 '*' 时的二次确认。仅为全目标授权时需要；默认 false，此时通配会被拒绝。
          title: Confirm Wildcard
          type: boolean
        pending_id:
          default: ''
          description: 可选的待处理条目 id（pending:<seq>）。审批中心带上它，同一张卡片重复点击只会得到同一条凭据，不会因为多点一次而叠加第二份授权。
          maxLength: 64
          title: Pending Id
          type: string
        reason:
          default: ''
          description: 授权理由（记入审计）
          maxLength: 500
          title: Reason
          type: string
        target:
          description: 被授权的具体 target（资源标识）。必填；授权仅对该 target 生效。授权全部 target 需显式写 '*' 并同时置 confirm_wildcard=true。
          minLength: 1
          title: Target
          type: string
        ttl_seconds:
          default: 300.0
          description: 有效期秒数，上限 3600
          exclusiveMinimum: 0.0
          maximum: 3600.0
          title: Ttl Seconds
          type: number
      required:
      - actions
      - target
      title: ApprovalRequest
      type: object
