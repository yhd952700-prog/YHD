      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Events V1 Audit Events Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Events
