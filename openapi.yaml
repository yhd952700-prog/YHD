  /v1/reminders/deliveries/{delivery_id}/close:
    post:
      description: '闭环一条已响提醒：done / snooze / dismiss（三选一）。


        ``ack`` 只记“知道了”，这里才是“这事完了”：done 走服务层完成，

        snooze 走服务层重排，dismiss 记 ack_status=''dismissed''。

        已处理过的投递返回 404（与 ack 同口径）；错过的提醒 snooze 时

        服务层返回 noop，本端点如实透传，不谎称已重排。'
      operationId: close_delivery_v1_reminders_deliveries__delivery_id__close_post
      parameters:
