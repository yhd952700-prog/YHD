      description: '删除一个项目，并一致地清理其下目标的 project_id 归属。


        写操作只作用于**自己的**项目（主账号也不例外，避免误删子树项目）；

        越权与不存在同为中性 404。


        有目标关联时**先拒绝**（409，附影响面），只有调用方明确 ``force=true``

        才继续：删除会解除目标与项目的归属，但绝不删除目标本身。这样"删除"

        不会悄无声息地把一个装满历史项目的容器清空。'
      operationId: delete_project_v1_projects__project_id__delete
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - description: 目标仍关联时仍强制删除（需先看过影响面）
        in: query
        name: force
        required: false
        schema:
          default: false
          description: 目标仍关联时仍强制删除（需先看过影响面）
          title: Force
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Project V1 Projects  Project Id  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Project
      tags:
      - projects
    get:
      description: 获取项目详情，并附带其下的真实目标与产出（越权与不存在同为中性 404）。
      operationId: get_project_v1_projects__project_id__get
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Project V1 Projects  Project Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Project
      tags:
      - projects
