  /v1/chat/stream:
    post:
      description: '流式对话（Server-Sent Events）。


        每个事件一行 ``data: {json}``：


        - ``{"type": "token", "content": "..."}``  逐 token

        - ``{"type": "tool", "name": ..., "args": ..., "output": ...}``  工具调用

        - ``{"type": "done", "turn": N, ...}``      结束帧（落盘/审计已完成）


        **预算/权限判定在建流之前完成**：拒绝时直接物理返回 ``402 budget_exceeded``

        / ``403 permission_denied``（JSON + ``X-LiuHao-Correlation-Id``），不会

        建立 ``text/event-stream``。只有建流之后才发生的兜底拒绝（等会话锁期间

        额度被别的会话用光）才用 ``done`` 帧的 ``status=denied`` + ``reason``

        表达 —— 那时 HTTP 状态已发出，改不了。


        重复提交（连点/重发）同样走幂等：后来者不会第二次调用模型，而是等首个

        流结束后重放同一份内容（结束帧带 ``deduplicated: true``）。'
      operationId: chat_stream_v1_chat_stream_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Chat Stream
      tags:
      - chat
