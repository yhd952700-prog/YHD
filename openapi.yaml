  /v1/accounts/recovery/reset:
    post:
      description: '用恢复码重置**码所属账号**的密码（根或登录页自助注册账号）；改密**成功之后**才消费恢复码。


        顺序契约（P1-6）：先改密、后作废。反序（先消费再改密）在改密失败时会把

        恢复码一起作废且不能重发，用户彻底锁死。这里与激活流程

        （``verify_activation_code`` → 改密 → ``consume_activation_code``）同序。


        来源契约：默认只接受本机回环请求（本机浏览器直接重置即可，不再强制

        桌面端一次性令牌）；可信启动下仍校验调用者与网关是同一个 Windows 账户。

        远程重置必须显式开启 ``LIUHAO_ALLOW_REMOTE_RECOVERY``（默认关闭；开启后

        任何能访问服务端口、且持有恢复码的来源都可重置根密码，风险自担）。'
      operationId: recovery_reset_v1_accounts_recovery_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Recovery Reset V1 Accounts Recovery Reset Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Recovery Reset
      tags:
      - accounts
  /v1/accounts/recovery/rotate:
    post:
      description: '生成/重发**本账号**的恢复码（旧码立即失效）。


        可签发对象：根账号，以及登录页自助注册的账号（``source`` 为

        ``self_service``）—— 后者没有管理员可代发激活码，不给恢复码就等于

        "换机或忘记密码后永久进不去"。管理员创建的成员仍由管理员重置密码，

        这里保持中性拒绝。


        这是"老根账号（0.1.0 时代创建、``recovery_hash`` 为空串）"的正规补发

        入口：只要还能登录，就能在这里拿到一枚**立刻可用**的新码。响应里没有

        ``expires_at`` —— 恢复码没有 TTL，返回一个生成时刻会被界面读成"有效期至"，

        让用户以为它会过期。'
      operationId: recovery_rotate_v1_accounts_recovery_rotate_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Recovery Rotate V1 Accounts Recovery Rotate Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Recovery Rotate
      tags:
      - accounts
  /v1/accounts/register:
    post:
      description: '首个注册者成为唯一根；已完成初始化时 409（并写审计）。


        顺序契约（P0-1）：**先凭据、后身份**。凭据写失败时账号树一个字节都没写，

        接口 500 之后同一个请求可以原样重试；反过来（先身份后凭据）一旦凭据写

        失败，根已经落盘 → ``/v1/auth/config`` 认为已初始化、再注册 409、登录

        401，用户既进不去也重开不了。


        来源契约：**未初始化**（无根 / 根有但无凭据）时只接受本机来源，否则

        任何能连上网关的人都能抢注成根。已完成初始化的 409 保持中性文案，不向

        远程透露根账号名。'
      operationId: register_root_v1_accounts_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRootRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Register Root V1 Accounts Register Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register Root
      tags:
      - accounts
