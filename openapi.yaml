  /v1/goals:
    get:
      description: '列出**当前账号可见**的 Goal 及其状态（别人的目标连计数都不进入）。


        结果里的 ``goals[]`` 在带 ``decomposition_source`` 时表示本次计划由谁拆解：


        * ``model`` —— 模型一次拆解成功；

        * ``model_retry`` —— 模型第一次拆解没过契约，补一段任务文本后重试成功；

        * ``keyword`` —— 模型不可用/两次都失败，已退成关键词规则拆解；

        * ``unknown`` —— 早于该字段的历史记录，来源无法判定。


        该字段**可能缺失**（老数据），读侧必须按 ``unknown`` 展示，不得默认成

        ``model`` —— 否则会把关键词拆解伪装成 AI 拆解。'
      operationId: list_goals_v1_goals_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Goals V1 Goals Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Goals
      tags:
      - ai-management
    post:
      description: '创建并执行一个新 Goal。


        调用 AgentRuntime.run_goal，走完整链：

        plan → execute → evaluate → persist。


        ``background=true`` 时只在后台启动执行并立即返回 ``state:"running"``，

        使 ``GET /v1/goals/{id}`` 可被轮询、``POST /v1/goals/{id}/stop`` 能真的

        终止一次运行中的执行 —— 没有这个开关，停止能力在 HTTP 面上永远不可达，

        因为目标在 POST 返回前就已经跑完了。'
      operationId: create_goal_v1_goals_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Goal V1 Goals Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Goal
      tags:
      - ai-management
  /v1/goals/assign:
    post:
      description: "把一件事**直接指派**给指定员工执行（独立于\"一句话自动拆解\"入口）。\n\n与 ``POST /v1/goals`` 的差别只在\"谁决定执行主体\"：\n\
        * 这里由调用方点名 ``employee_name`` 或 ``agent_id``，**必须真实存在**\n  （否则 404），绝不静默换成别的员工；\n* ``POST /v1/goals``\
        \ 仍由管家自己拆解、自己派活（可选 ``employee_name``\n  把整个目标钉给某位员工）。\n\n权限沿用现有模型：要求人类主权令牌（与 ``POST /v1/goals``\
        \ 同一道\n``require_human_principal``），不因为多了这个入口而放宽。\n``background=true``（默认）时立即返回 ``running``，随后\n\
        ``GET /v1/goals/{id}`` 会逐条给出任务进度。"
      operationId: assign_goal_v1_goals_assign_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Assign Goal V1 Goals Assign Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Assign Goal
      tags:
      - ai-management
