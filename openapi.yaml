  /v1/policy/authority-mode:
    get:
      description: '当前运行模式（只读）。


        ``mode`` 是本进程**启动时**快照到的生效值；``next_mode`` 是重启后会生效的

        值。两者不同只可能出现在"开启全权还没重启"这一种情况 —— 放宽不做热切，

        避免一次任务中途出现"半套权限"；收回则由总闸立即生效。'
      operationId: get_authority_mode_v1_policy_authority_mode_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Authority Mode V1 Policy Authority Mode Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Authority Mode
      tags:
      - policy
    put:
      description: '保存运行模式（管理员）。收**立即**生效；开**重启后**生效。


        收紧（→ standard）走总闸语义：``revoke_now`` 当场把本进程压回标准模式，

        再把盘上的值写回 standard，所以重启也不会"复活"全权。放宽（→ full）只写盘，

        必须重启 —— 避免一次任务中途出现"半套权限"的窗口。


        0.4.6 起开启全权多两道闸：① 必须是账号树根（Owner），管理员（非根）

        只能收回、不能开启；② 必须带 ``confirm=True`` 二次确认。缺任何一道

        都 403/400 拒绝，配置不动。


        切换记录本身进审计（``AUTHORITY_MODE_CHANGED``）：谁、何时、从什么切到

        什么、为什么。收回时顺带撤销该主体名下所有仍有效的审批凭据 —— 全权期间

        签出去的授权不应在收紧之后继续活着。'
      operationId: set_authority_mode_v1_policy_authority_mode_put
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityModeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Set Authority Mode V1 Policy Authority Mode Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Authority Mode
      tags:
      - policy
