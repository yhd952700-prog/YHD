          - type: string
          - type: 'null'
          description: 按事件类型过滤
          title: Event Type
      - description: 返回条数上限
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: 返回条数上限
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: true = 最新的在前
        in: query
        name: reverse
        required: false
