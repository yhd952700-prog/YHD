  /v1/knowledge/documents/upload:
    post:
      description: "Multipart upload for PDF / DOCX / HTML / plain text (synchronous).\n\nEvery format\
        \ is reduced to extracted text **before** it reaches the index,\nso the content hash (and therefore\
        \ dedup) is computed on what the library\nactually says, not on the file name or bytes. PDF chunks\
        \ carry ``page``\nmetadata and search hits expose ``page`` / ``location``.\n\nErrors are the extractor's\
        \ own readable messages:\n  * 413 -- file size / PDF page count / extracted length over the cap;\n\
        \  * 415 -- unsupported suffix;\n  * 422 -- scanned PDF (no text layer), encrypted PDF, corrupt\
        \ file, empty\n    document, or a text layer full of broken glyphs. A scanned PDF never\n    returns\
        \ an empty string as \"success\", and a garbled text layer is never\n    stored silently: the\
        \ caller must retry with ``allow_low_quality=true``.\n\nLarge files belong on ``POST /documents/upload/jobs``:\
        \ this handler blocks\nuntil extraction + embedding finish."
      operationId: knowledge_upload_document_v1_knowledge_documents_upload_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_knowledge_upload_document_v1_knowledge_documents_upload_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Knowledge Upload Document V1 Knowledge Documents Upload Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Knowledge Upload Document
      tags:
      - knowledge
      - knowledge
  /v1/knowledge/documents/upload/jobs:
    post:
      description: 'Queue a **file** ingest job and return immediately with a job id.


        This is the async twin of ``POST /documents/upload``: the bytes are read

        here, then extraction and embedding happen in the worker. A 300-page PDF

        therefore answers 202 instantly and reports real page progress via

        ``GET /ingest/jobs/{job_id}`` (``total_pages`` / ``extracted_pages`` /

        ``embedded_pages`` / ``progress_percent``). Cancel with

        ``POST /ingest/jobs/{job_id}/cancel``: nothing is written until the whole

        document is embedded, so a cancel is a full rollback (全回滚).


        Extraction failures (scanned PDF, encrypted/corrupt file, garbled text layer)

        do not fail the *request* -- they are reported on the job as

        ``status=failed`` with ``error_code`` and the extractor''s message. For a

        garbled text layer the job keeps the measured ``quality`` and the caller

        can resubmit with ``allow_low_quality=true`` after inspecting it.'
      operationId: knowledge_submit_upload_job_v1_knowledge_documents_upload_jobs_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_knowledge_submit_upload_job_v1_knowledge_documents_upload_jobs_post'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Knowledge Submit Upload Job V1 Knowledge Documents Upload Jobs Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Knowledge Submit Upload Job
      tags:
      - knowledge
      - knowledge
