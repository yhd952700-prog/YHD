            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Summary
      tags:
      - audit
  /v1/audit/verify:
    get:
      description: '校验哈希链完整性（只读，不修复）。


        ``ok=false`` 就是被改过/被截断/被分叉。本端点**从不**修复链：写回一个

        重算过的哈希正是 tamper-evidence 的反面。'
      operationId: verify_chain_v1_audit_verify_get
      parameters:
      - description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
        in: query
        name: full
        required: false
        schema:
          default: false
          description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
          title: Full
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
