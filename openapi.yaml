        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
