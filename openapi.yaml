  /v1/policy/approvals/pending:
    get:
      description: '列出**等待当前人工确认**的动作（只读）。


        审批中心此前只有"已签发凭据"，没有"还有什么在等我"。数据来源是内核

        真实的拦截记录：HIGH/CRITICAL 动作被 ``PolicyEffect.DEFER`` 拦下时，审计

        链会写一条 ``outcome="blocked"``、``policy_decision="defer"`` 的事件

        （``deny`` / ``error`` 是硬拒绝，不需要人批，因此不计入）。


        已有一条有效凭据覆盖的动作不再算"待处理"——它已经批过了；被用户明确

        拒绝的条目也不再显示（拒绝记录同样在审计链里）。

        ``approve`` 字段给出可照抄的下一步请求，使页面能直接处理而不是只显示。


        可见性：只有**能真正签发凭据**的人类主体才看得到这个队列

        （``require_admin_principal``，与 ``POST /v1/policy/approvals`` 同一道

        门）。非管理员不是"看到空列表"，而是 403 —— 跨主体不泄露。'
      operationId: list_pending_approvals_v1_policy_approvals_pending_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Pending Approvals V1 Policy Approvals Pending Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Pending Approvals
      tags:
      - policy
  /v1/policy/approvals/reject:
    post:
      description: '明确拒绝一条待确认动作（审计留痕，不产生任何可执行权限）。


        为什么需要：此前审批中心只有「批准」，用户面对高危动作只剩「同意」这一个

        选择，等同于强制放行。拒绝的语义是「明确不批」：动作在被拦下时就没有执行，

        拒绝只做两件事——写审计、让卡片不再显示为等待中；它不会制造授权，

        也不会重放或自动重试原动作。'
      operationId: reject_pending_approval_v1_policy_approvals_reject_post
