  /v1/accounts/totp/admin-reset:
    post:
      description: "主账号帮子账号重置双重验证（任务 4(b)）。\n\n子账号验证器丢了、备用码也丢了，自己关不掉（关闭接口要验证码或备用码），\n又没有恢复码可走：只能由主账号在成员管理里帮他重置。重置后该账号的密钥\n\
        与全部备用码一并销毁，他其他设备上的登录全部退出，之后只用密码登录，\n再到自己的账号安全页重新绑定验证器。\n\n规矩（Joseph 2026-11-15 ~10:03：子账号只能动自己的东西）：\n\
        \n* 只有主账号能调；子账号调一律 403（对别人、对主账号、对自己都一样）；\n* 目标必须是已存在的普通成员；主账号不能拿这个接口重置自己的 TOTP\n  （自己的走账号安全页现有流程），也不能重置主账号；\n\
        * 目标没开 TOTP → 409，不谎报重置成功；\n* 审计记 actor=主账号、target=子账号（``account.totp.reset_by_admin``），\n  主账号在审计链里能查到，子账号那边不另行通知——按\
        \ 2026-11-14 定好的\n  主/子账号规矩，主账号的操作不在子账号侧留痕。"
      operationId: totp_admin_reset_v1_accounts_totp_admin_reset_post
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpAdminResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Totp Admin Reset V1 Accounts Totp Admin Reset Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Totp Admin Reset
      tags:
      - totp
