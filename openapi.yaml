        直接复用事件内核的内存近期事件缓冲 ``get_event_history`` —— 内核已保真地记录了

        总线上的真实事件；这里只呈现，不复制、不修饰。``limit`` 取最近 N 条。


        非 ``L0`` 调用者只看到能归属到自己的事件（见 ``_belongs_to``）；拿不到

