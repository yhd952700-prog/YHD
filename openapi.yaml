  description: "GENERATED SNAPSHOT of the REAL runtime contract, exported from\n`src.gateway.main.get_app().openapi()`\
    \ by `scripts/verify_openapi_contract.py --write`.\n\nWHY THIS FILE USED TO BE WRONG: the previous\
    \ hand-written openapi.yaml\ndeclared 6 paths (`/v1/health`, `/v1/metrics`, `/v1/ready`,\n`/v1/auth/token`,\
    \ `/v1/api/providers`, `/v1/rbac/roles`) -- NOT ONE of\nwhich exists in the running gateway (0/6 overlap),\
    \ while omitting all 58\nreal paths. It also advertised a production host\n`https://api.liuhao-ai-os.com`\
    \ that the project does not operate.\n\nHONESTY RULES FOR THIS FILE:\n* It is a SNAPSHOT, not the\
    \ source of truth. The source of truth is the\n  code: `GET /openapi.json` on a running gateway (the\
    \ console reads that,\n  not this file -- see `apps/console/console/src/pages/Directory.tsx`).\n*\
    \ Verify freshness with `python scripts/verify_openapi_contract.py`.\n  Drift is a FAIL, not a warning.\n\
    * Auth is fail-closed: most `/v1/*` paths require a human token.\n  A path's presence here does NOT\
    \ mean it is safe to call unauthenticated."
  title: LiuHao AI OS Gateway API
  version: 1.0.0
