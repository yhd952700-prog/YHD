  /v1/audit/events:
    get:
      description: '列出审计事件（只读）。


        返回值带 ``filters`` 回声，因为"我看到的列表是哪个过滤条件下看到的"

        本身就是要展示给人的信息 —— 空结果到底是没有事件还是筛错了，必须可分。


        非根调用者只能读自己：``principal`` 显式指定别人一律 404（与不存在不可区分）；

        根账号未指定时读整棵子树，并在 ``read_scope`` 与每条事件的 ``is_self`` 上

        明确标记"这是跨账号读取"。'
      operationId: list_events_v1_audit_events_get
      parameters:
      - description: 按主体过滤
        in: query
        name: principal
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按主体过滤
          title: Principal
      - description: 按内核动作名过滤（details.action，如 execution.execute）
        in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按内核动作名过滤（details.action，如 execution.execute）
          title: Action
      - description: 按结果过滤（success/denied/...）
        in: query
        name: outcome
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按结果过滤（success/denied/...）
          title: Outcome
      - description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
        in: query
        name: correlation_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
          title: Correlation Id
      - description: 起始 Unix 时间戳（秒，含）
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: 起始 Unix 时间戳（秒，含）
          title: Since
      - description: 结束 Unix 时间戳（秒，含）
        in: query
        name: until
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: 结束 Unix 时间戳（秒，含）
          title: Until
      - description: 按事件类型过滤
        in: query
        name: event_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按事件类型过滤
          title: Event Type
      - description: 返回条数上限
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: 返回条数上限
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: true = 最新的在前
        in: query
        name: reverse
        required: false
        schema:
          default: false
          description: true = 最新的在前
          title: Reverse
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Events V1 Audit Events Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Events
      tags:
      - audit
