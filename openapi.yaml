      description: '列出告警（只读）。返回 firing 告警与最近告警；库为空时 count=0，不是错误。


        这是把"只写不读"的告警存储变成操作员可见的第一步：执行失败告警（真实路径）

        此前只落日志/JSON，没有任何 API 或 UI 能读取。本端点如实返回当前库里的内容。'
      operationId: list_alerts_v1_alerts_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Alerts V1 Alerts Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Alerts
      tags:
      - observability
  /v1/alerts/rules:
    get:
      description: '列出已注册的告警规则及其真实 enabled 状态。


        诚实说明：install_production_rules() 注册的 7 条系统健康规则现已全部

        enabled=True —— 真正的指标发射器（MetricCollector）已接线，网关 lifespan

        里的 15s 守护线程会把真实快照喂给 AlertManager.evaluate_all，真实越界才会

        产生真实告警。本端点如实返回规则状态，不美化。'
      operationId: list_alert_rules_v1_alerts_rules_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Alert Rules V1 Alerts Rules Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Alert Rules
      tags:
      - observability
  /v1/audit/events:
    get:
      description: '列出审计事件（只读）。


        返回值带 ``filters`` 回声，因为"我看到的列表是哪个过滤条件下看到的"

        本身就是要展示给人的信息 —— 空结果到底是没有事件还是筛错了，必须可分。


        非根调用者只能读自己：``principal`` 显式指定别人一律 404（与不存在不可区分）；

        根账号未指定时读整棵子树，并在 ``read_scope`` 与每条事件的 ``is_self`` 上

        明确标记"这是跨账号读取"。'
      operationId: list_events_v1_audit_events_get
      parameters:
      - description: 按主体过滤
        in: query
        name: principal
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按主体过滤
          title: Principal
      - description: 按内核动作名过滤（details.action，如 execution.execute）
        in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按内核动作名过滤（details.action，如 execution.execute）
          title: Action
      - description: 按结果过滤（success/denied/...）
        in: query
        name: outcome
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按结果过滤（success/denied/...）
          title: Outcome
      - description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
        in: query
        name: correlation_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
          title: Correlation Id
      - description: 起始 Unix 时间戳（秒，含）
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: 起始 Unix 时间戳（秒，含）
          title: Since
      - description: 结束 Unix 时间戳（秒，含）
        in: query
        name: until
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: 结束 Unix 时间戳（秒，含）
          title: Until
      - description: 按事件类型过滤
        in: query
        name: event_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按事件类型过滤
          title: Event Type
      - description: 返回条数上限
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: 返回条数上限
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: true = 最新的在前
        in: query
        name: reverse
        required: false
        schema:
          default: false
          description: true = 最新的在前
          title: Reverse
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Events V1 Audit Events Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Events
      tags:
      - audit
  /v1/audit/events/{seq}:
    get:
      description: '按序号取单条事件（只读）。


        同一 seq 若存在多行（RCA-1 分叉特征），只返回 rowid 最小的一行并如实

        标注 ``duplicate_seq`` —— 隐藏第二行等于替攻击者保守秘密。


        非根调用者读取他人的事件一律 404（不暴露"该 seq 存在但你不能看"）；根账号

        读子树内成员的事件返回 200，并带 ``read_scope`` 与 ``event.is_self`` 标记。'
      operationId: get_event_v1_audit_events__seq__get
      parameters:
      - in: path
        name: seq
        required: true
        schema:
          title: Seq
          type: integer
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Event V1 Audit Events  Seq  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Event
      tags:
      - audit
  /v1/audit/export:
    get:
      description: '导出审计记录归档（只读，仅根账号 / 独立主权令牌）。


        归档是**给人留存与比对**的副本，不是密钥证明：包含事件原文、导出时刻的

        校验结果与尾锚点，但**不含校验密钥**（密钥永不出机）。换机后没有密钥时，

        这份归档只能用于查阅/比对，不能替代原机上的带密钥校验。'
      operationId: export_events_v1_audit_export_get
      parameters:
      - description: 只导出 seq 大于该值的事件（翻页用）
        in: query
        name: since_seq
        required: false
        schema:
          default: 0
          description: 只导出 seq 大于该值的事件（翻页用）
          minimum: 0
          title: Since Seq
          type: integer
      - description: 单次导出条数上限（超出用 next_since_seq 续导）
        in: query
        name: limit
        required: false
        schema:
          default: 5000
          description: 单次导出条数上限（超出用 next_since_seq 续导）
          maximum: 20000
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Export Events V1 Audit Export Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Export Events
      tags:
      - audit
  /v1/audit/summary:
    get:
      description: '审计概览（只读）：按 outcome / action 计数，供驾驶舱看。


        这里**故意不**附带 verify 结果 —— 那会为每个轮询请求扫一遍全链（生产库

        30 万行量级）。要结论就显式打 ``/v1/audit/verify``。


        非根调用者只看自己主体的事件计数，避免通过聚合数字横向推断他人活动；

        根账号看整棵子树，并在 ``principal_scope`` 上标明 ``subtree``。'
      operationId: summary_v1_audit_summary_get
      parameters:
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Summary V1 Audit Summary Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Summary
      tags:
      - audit
  /v1/audit/verify:
    get:
      description: '校验哈希链完整性（只读，不修复）。


        ``ok=false`` 就是被改过/被截断/被分叉。本端点**从不**修复链：写回一个

        重算过的哈希正是 tamper-evidence 的反面。'
      operationId: verify_chain_v1_audit_verify_get
      parameters:
      - description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
        in: query
        name: full
        required: false
        schema:
          default: false
          description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
          title: Full
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Verify Chain V1 Audit Verify Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Verify Chain
      tags:
      - audit
    post:
      description: 与 ``GET /v1/audit/verify`` 完全相同的只读校验。
      operationId: verify_chain_post_v1_audit_verify_post
      parameters:
      - description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
        in: query
        name: full
        required: false
        schema:
          default: false
          description: true = 从头重算全链（慢，但能发现历史篡改）；false = 增量校验
          title: Full
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Verify Chain Post V1 Audit Verify Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Verify Chain Post
      tags:
      - audit
