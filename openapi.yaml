          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Events V1 Events Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Events
      tags:
      - events
  /v1/events/history:
    get:
      description: '持久事件历史（只读，来自审计库）。


        与 ``/v1/events`` 的区别：那个读内存环形缓冲，只覆盖"本进程运行期间"；

        这里读审计库 ``audit_events``，覆盖"这个部署写过的全部事件"。两个都有

        存在的理由，但只有后者能回答"昨天发生了什么"。


        读库失败时返回 503 与真实原因 —— **绝不**返回空列表，否则调用方分不清

        "没有历史"和"历史读不出来"。


        非 ``L0`` 调用者的 ``principal`` 被强制为令牌主体；显式查询别人 → 403。'
      operationId: list_persisted_event_history_v1_events_history_get
      parameters:
      - description: 按主体过滤
        in: query
        name: principal
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按主体过滤
          title: Principal
      - description: 按事件类型过滤
        in: query
        name: event_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按事件类型过滤
          title: Event Type
      - description: 按结果过滤（success/denied/...）
        in: query
        name: outcome
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按结果过滤（success/denied/...）
          title: Outcome
      - description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
        in: query
        name: correlation_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按关联 ID 过滤 —— 一次目标执行产生的全部事件
          title: Correlation Id
      - description: 起始 Unix 时间戳（秒，含）
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          description: 起始 Unix 时间戳（秒，含）
          title: Since
      - description: 结束 Unix 时间戳（秒，含）
        in: query
        name: until
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          description: 结束 Unix 时间戳（秒，含）
          title: Until
      - description: 返回条数上限
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: 返回条数上限
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: true = 最新的在前
        in: query
        name: reverse
        required: false
        schema:
          default: true
          description: true = 最新的在前
          title: Reverse
          type: boolean
      - in: header
        name: x-liuhao-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Liuhao-Token
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Persisted Event History V1 Events History Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Persisted Event History
      tags:
      - events
