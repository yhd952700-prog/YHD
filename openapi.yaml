  /v1/goals/{goal_id}/stop:
    post:
      description: '人类操作员中止一个正在运行的 Goal（主权控制）。


        控制台「中止」按钮的落点。若目标仍在后台运行，设置其 stop flag，执行循环

        会在任务边界干净抛出 GoalCancelled，目标被置为 ``cancelled``（绝不伪造成功）；

        若目标已结束则幂等标记为 ``cancelled``。人类喊停动作会被审计。

        只允许中止自己的目标（别人的一律 404）。'
