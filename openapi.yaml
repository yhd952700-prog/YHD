  /v1/accounts/self-register:
    post:
      description: "自助注册：用户名 + 密码即可，无需邀请码；但**要等批准才开通**。\n\n新规矩（Joseph 2026-11-14 亲口定，取代旧的“注册即开通”口径）：\n\
        \n* 上级恒为本机根账号的第 1 层（不接受请求体里的父子/深度字段）；\n* 作用域恒为最小集合（不能建下级、不能授权、不能借 Key）；\n* 注册完是 ``pending_approval``（等批准）状态：**不发登录令牌**，\n\
        \  登录即被拒（``auth.py`` 的 ``authenticate`` 在人类身份分支也查\n  状态，非 active 一律 403 ``ACCOUNT_UNAVAILABLE``），任何业务接口\n\
        \  也过不了 ``require_account_principal`` 的 active 检查；主账号在\n  成员管理里点一下批准（``POST /v1/a3m/owner/registrations/{principal}/approve``）\n\
        \  才变 active；\n* 主账号关闭开关后返回结构化拒绝 ``ACCOUNT_SELF_REGISTER_DISABLED``。\n\n恢复码：自助注册的账号没有管理员可代发激活码，因此与根账号一样**当场**\n\
        签发一枚恢复码（库中只存 sha256，明文只出现在本次响应里）。签发失败\n不回滚已经建好的账号（用户会误以为没建成功并重试同名 → 409），而是\n如实返回空码并指路「我的 → 恢复码」补发。\n\
        \n文案中性：响应里不出现任何关于“谁能看到什么”的字样。"
      operationId: self_register_v1_accounts_self_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfRegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Self Register V1 Accounts Self Register Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Self Register
      tags:
      - accounts
