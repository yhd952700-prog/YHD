# =============================================================================
# LiuHao AI OS — 日志配置（唯一生效的一份）
# =============================================================================
# 加载方式：所有真实入口都以「配置路径」交给 uvicorn，而不是在代码里再调一套
# dictConfig：
#
#   * scripts/start_liuhao.py      -> uvicorn ... --log-config config/logging.yaml
#   * src/desktop/service.py       -> 同上（托盘壳拉起网关子进程）
#   * src/gateway/__main__.py      -> uvicorn.run(..., log_config=config/logging.yaml)
#
# 为什么是 uvicorn 而不是在 app 里调用 setup_logging()：
#   uvicorn 在导入 app 之前应用这份配置，所以它同时覆盖 uvicorn 自身的
#   access/error logger 与应用 logger（后者没有自己的 handler，向上传播到
#   root）。若放在 app 模块里，测试导入 app 时也会配置日志、把日志写进仓库。
#
# 轮转参数（用户可见的磁盘上限）：
#   * 单文件上限 10 MiB
#   * 保留 5 份历史（.1 ~ .5）
#   * 不压缩：stdlib RotatingFileHandler 不支持 gzip；为压缩而自写 handler 会
#     在日志线程里增加 CPU 与失败面。总量上限 = (5 + 1) × 10 MiB ≈ 60 MiB/文件
#     通道；liuhao.log 与 error.log 两个通道合计 ≤ 120 MiB。
#
# 控制台只输出 WARNING 及以上：INFO 全量进文件（可轮转），避免桌面壳把子进程
# stdout 追加到 desktop-gateway.log 时无限增长。
# =============================================================================

version: 1
disable_existing_loggers: false

formatters:
  text:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: text
    stream: ext://sys.stdout

  app_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: text
    filename: logs/liuhao.log
    maxBytes: 10485760          # 10 MiB
    backupCount: 5
    encoding: utf-8
    delay: true                 # 首次写入才打开，避免空文件

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: text
    filename: logs/error.log
    maxBytes: 10485760          # 10 MiB
    backupCount: 5
    encoding: utf-8
    delay: true

loggers:
  # 不定义 handler：向上传播到 root，由 root 的轮转文件接住。
  uvicorn:
    level: INFO
    propagate: true
  uvicorn.access:
    level: INFO
    propagate: true
  # 第三方库降噪
  sqlalchemy.engine:
    level: WARNING
    propagate: true
  httpx:
    level: WARNING
    propagate: true
  httpcore:
    level: WARNING
    propagate: true

root:
  level: INFO
  handlers: [console, app_file, error_file]
