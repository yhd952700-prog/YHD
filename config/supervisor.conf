; =============================================================================
; LiuHao AI OS — Supervisor 进程管理配置 (supervisor.conf)
; =============================================================================
; 用途：
;   裸机/虚拟机部署（非 Docker）时使用 supervisord 管理应用进程：
;   自动拉起、崩溃重启、日志轮转、进程分组与优雅停止。
;
; 使用方式：
;   1. 安装：pip install supervisor
;   2. 链接：ln -s $PWD/config/supervisor.conf /etc/supervisor/conf.d/liuhao.conf
;   3. 生效：supervisorctl reread && supervisorctl update
;   4. 控制：supervisorctl status|start|stop|restart liuhao:*
;
; 重要参数：
;   - numprocs / process_name   多进程时的命名模板
;   - stopwaitsecs              与 graceful_shutdown.timeout_seconds 对齐
;   - autorestart=unexpected    仅异常退出才重启，手动 stop 不会被拉起
;   - exitcodes=0               干净退出码不触发 autorestart
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=liuhao:liuhao

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=65536                         ; 文件描述符下限，LLM 并发连接需要
minprocs=200
user=root                            ; 主守护以 root 启动，子进程降权到各自 user

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; -----------------------------------------------------------------------------
; 应用主进程（uvicorn，多 worker 由 uvicorn 自身管理，supervisor 只管一层）
; -----------------------------------------------------------------------------
[program:liuhao-app]
command=/opt/liuhao/.venv/bin/uvicorn main:app
    --host 127.0.0.1
    --port 8080
    --workers 4
    --loop uvloop
    --no-access-log
directory=/opt/liuhao
user=liuhao
numprocs=1
process_name=%(program_name)s
environment=
    APP_ENV="production",
    LIUHAO_ENV="production",
    PYTHONUNBUFFERED="1",
    PATH="/opt/liuhao/.venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=10                         ; 启动 10s 内不退出才算启动成功
startretries=3                       ; 连续 3 次启动失败进入 FATAL，告警介入
stopasgroup=true                     ; 停止时信号发给整个进程组（含子进程）
killasgroup=true
stopsignal=TERM                      ; 触发 graceful shutdown
stopwaitsecs=45                      ; 与 resilience.graceful_shutdown.timeout 对齐
stdout_logfile=/var/log/liuhao/supervisor-app.out.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/var/log/liuhao/supervisor-app.err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5
redirect_stderr=false

; -----------------------------------------------------------------------------
; 后台任务 worker（taskiq 消费者：goal 恢复扫描 / 记忆固化 / 知识库摄取）
;
; 队列默认走 SQLite（单机多进程可用，不要求 Redis / Postgres）：
;   LIUHAO_TASK_BROKER=sqlite, LIUHAO_TASK_DB=<workspace>/queue/tasks.db
; 队列与事件总线的边界见 src/tasks/broker.py 模块文档。
; AUDIT_DB_PATH 必须与 API 进程一致（worker 强制审计，未配置会拒绝启动）。
;
; 本地排程器（单机时间点执行 / 指数退避重试 / 死信）在此**显式关闭**：
; 它假设单进程独占一个 SQLite 库，而这里 numprocs=2；由单实例的
; liuhao-scheduler 进程运行（见下方）。
; -----------------------------------------------------------------------------
[program:liuhao-worker]
command=/opt/liuhao/.venv/bin/python -m src.workers.runner
directory=/opt/liuhao
user=liuhao
numprocs=2                           ; 两个 worker 进程
process_name=%(program_name)s_%(process_num)02d
environment=
    APP_ENV="production",
    LIUHAO_ENV="production",
    PYTHONUNBUFFERED="1",
    AUDIT_DB_PATH="/opt/liuhao/data/audit_store.db",
    LIUHAO_WORKSPACE_ROOT="/opt/liuhao/data",
    LIUHAO_TASK_BROKER="sqlite",
    LIUHAO_TASK_DB="/opt/liuhao/data/queue/tasks.db",
    LIUHAO_LOCAL_SCHEDULER="0"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60                      ; worker 需完成在途任务
stdout_logfile=/var/log/liuhao/supervisor-worker.out.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/var/log/liuhao/supervisor-worker.err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5

; -----------------------------------------------------------------------------
; 定时任务调度器
;   1) taskiq 自带 TaskiqScheduler + LabelScheduleSource：周期由任务注册时的
;      schedule label 声明，不引入 APScheduler。
;   2) 同进程的本地排程器（src/tasks/local_scheduler.py）：单机时间点执行、
;      失败指数退避重试（有上限）、耗尽落死信（local_jobs 表 + 审计事件
;      local_scheduler.dead_letter）。numprocs=1 是硬约束 —— 它独占同一个
;      SQLite 库，不能多实例。
; -----------------------------------------------------------------------------
[program:liuhao-scheduler]
command=/opt/liuhao/.venv/bin/python -m src.workers.scheduler
directory=/opt/liuhao
user=liuhao
numprocs=1                           ; 调度器只能单实例，避免任务重复触发
process_name=%(program_name)s
environment=
    APP_ENV="production",
    PYTHONUNBUFFERED="1",
    AUDIT_DB_PATH="/opt/liuhao/data/audit_store.db",
    LIUHAO_WORKSPACE_ROOT="/opt/liuhao/data",
    LIUHAO_TASK_BROKER="sqlite",
    LIUHAO_TASK_DB="/opt/liuhao/data/queue/tasks.db",
    LIUHAO_LOCAL_SCHEDULER="1",
    LIUHAO_LOCAL_SCHEDULER_DB="/opt/liuhao/data/queue/local_scheduler.db",
    LIUHAO_LOCAL_SCHEDULER_CONCURRENCY="4",
    LIUHAO_LOCAL_HEARTBEAT_INTERVAL="300"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/liuhao/supervisor-scheduler.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/liuhao/supervisor-scheduler.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

; -----------------------------------------------------------------------------
; 进程组：一条命令管理全部
; -----------------------------------------------------------------------------
[group:liuhao]
programs=liuhao-app,liuhao-worker,liuhao-scheduler
priority=999
