# =============================================================================
# LiuHao AI OS — Nginx 反向代理配置 (nginx.conf)
# =============================================================================
# 用途：
#   生产边缘层：TLS 终结、反向代理到应用（:8080）、静态资源服务、
#   WebSocket 支持（LLM 流式输出）、限流、安全响应头、gzip 压缩。
#
# 部署方式：
#   裸机：软链到 /etc/nginx/sites-available/liuhao 并 nginx -t 后 reload
#   Docker：挂载到 /etc/nginx/conf.d/default.conf
#
# 重要参数：
#   - server_name           生产域名，配合 DNS 与证书
#   - ssl_certificate*      证书路径；推荐 ACME（certbot/lego）自动续期
#   - proxy_read_timeout    LLM 流式响应可能很长，不能太小
#   - client_max_body_size  与 default.yaml server.limits 对齐
#   - limit_req_zone        边缘限流，与应用内限流构成双保险
# =============================================================================

# --- 全局（置于 http{} 上下文内的部分；裸机部署时外层 events/http 由主配置提供） ---

#  upstream 定义
upstream liuhao_app {
    # 多实例负载均衡；least_conn 适合 LLM 长请求（避免排队堆积在忙实例）
    least_conn;
    server app:8080 max_fails=3 fail_timeout=30s;
    # server app2:8080 max_fails=3 fail_timeout=30s;   # 水平扩容时取消注释

    keepalive 32;                    # 到上游的长连接池，降低 TCP 握手开销
}

# 边缘限流区：按客户端 IP，10MB 内存约 16 万个 IP
limit_req_zone $binary_remote_addr zone=liuhao_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=liuhao_auth:10m rate=5r/m;

# 请求体超限/连接异常时返回 JSON 而不是 HTML
map $status $liuhao_error_json {
    default '{"error": {"code": $status, "message": "edge error"}}';
}

# 只对文本类响应启用 gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    application/xml
    image/svg+xml;

# -----------------------------------------------------------------------------
# HTTP → HTTPS 重定向
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ai.liuhao.example.com;

    # ACME http-01 挑战路径（certbot 续期用），不重定向
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 主服务
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.liuhao.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/ai.liuhao.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.liuhao.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;           # TLS1.3 下由客户端决定，更安全且快
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP 按前端实际需要调整；以下为 API 服务的严格基线
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # --- 请求体与超时 ---
    client_max_body_size 50m;                # 与 server.limits.max_upload_bytes 对齐
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 75s;
    send_timeout 60s;

    # --- 真实 IP（上游可信代理链） ---
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # --- 访问日志 ---
    access_log /var/log/nginx/liuhao.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/liuhao.error.log warn;

    # -------------------------------------------------------------------------
    # 健康检查：不经应用限流，直接透传
    # -------------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://liuhao_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # API 主路径
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=liuhao_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://liuhao_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;              # 普通 API 上限
        proxy_send_timeout 60s;

        # 上游 5xx 的幂等 GET 可重试到下一实例
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # 认证路径：更严的限流（防爆破）
    # -------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=liuhao_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://liuhao_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # LLM 流式输出（SSE / WebSocket）：关闭缓冲、长超时
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/(chat/stream|agents/.*/stream|conversations/.*/stream) {
        proxy_pass http://liuhao_app;
        proxy_http_version 1.1;

        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：禁用代理缓冲，逐 token 下发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no";

        proxy_read_timeout 600s;              # 长流式会话
        proxy_send_timeout 600s;
    }

    # -------------------------------------------------------------------------
    # 指标端点：仅内网/监控系统可访问
    # -------------------------------------------------------------------------
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://liuhao_app:9090/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # 前端静态资源（SPA）
    # -------------------------------------------------------------------------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1d;                           # 带指纹文件名，可长缓存
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        expires -1;                           # index.html 不缓存
        add_header Cache-Control "no-store";
        # SPA fallback：前端路由全部回到 index.html
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # 错误页：统一 JSON
    # -------------------------------------------------------------------------
    error_page 404 429 500 502 503 504 /__error.json;
    location = /__error.json {
        internal;
        default_type application/json;
        return 200 $liuhao_error_json;
    }
}

# map 需要放在 http 上下文顶层；若本文件被 include 进 http{} 则保留于此，
# 否则移到主 nginx.conf 的 http{} 块中：
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
