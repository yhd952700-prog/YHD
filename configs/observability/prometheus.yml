# Prometheus Configuration for LiuHao AI OS
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'liuhao-ai-os'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - 'rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # LiuHao AI OS application metrics
  - job_name: 'liuhao-ai-os'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['liuhao-ai-os:8000']
        labels:
          service: 'liuhao-ai-os'
          component: 'api'

  # Provider metrics
  - job_name: 'ai-providers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['liuhao-ai-os:8000']
        labels:
          service: 'liuhao-ai-os'
          component: 'providers'

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
