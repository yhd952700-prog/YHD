server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: liuhao-ai-os
    static_configs:
      - targets:
          - localhost
        labels:
          job: liuhao-ai-os
          service: liuhao-ai-os
          __path__: /var/log/liuhao-ai-os/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: name
            message: message
            correlation_id: correlation_id
            event_type: event_type
            provider: provider
            model: model
            agent_id: agent_id
            goal_id: goal_id
            task_id: task_id
      - labels:
          level:
          logger:
          event_type:
          provider:
          model:
          agent_id:
          goal_id:
          task_id:
      - timestamp:
          source: timestamp
          format: RFC3339
