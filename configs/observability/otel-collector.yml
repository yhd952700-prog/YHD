# OpenTelemetry Collector Configuration for LiuHao AI OS
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

  # Custom receiver for AI provider metrics
  ai_provider_metrics:
    endpoint: 0.0.0.0:9464

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  # Add correlation ID to all spans
  attributes:
    actions:
      - key: correlation_id
        action: upsert
        from_attribute: "traceparent"
        # Extract correlation ID from traceparent header

  # Resource detection
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "liuhao_ai_os"
    send_timestamps: true

  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Phoenix exporter - send traces to Phoenix for LLM observability
  otlp/phoenix:
    endpoint: "phoenix:4317"
    tls:
      insecure: true

  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 100

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter, attributes, resourcedetection]
      exporters: [otlp, otlp/phoenix, logging]

    metrics:
      receivers: [otlp, prometheus, ai_provider_metrics]
      processors: [batch, memory_limiter, attributes, resourcedetection]
      exporters: [prometheus, logging]

    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter, attributes, resourcedetection]
      exporters: [logging]
