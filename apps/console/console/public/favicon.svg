<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="鎏灏 AI">
  <!-- 与 PWA 图标（scripts/generate_pwa_icons.py 生成的 PNG）同一个形状：
       圆角渐变底 + 尖顶六边形描边 + 中心圆点。两者必须一致，否则浏览器标签页
       与装到桌面/主屏的图标会是两个牌子。 -->
  <defs>
    <linearGradient id="liuhao-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e7bf0" />
      <stop offset="1" stop-color="#101b3e" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#liuhao-tile)" />
  <path
    d="M32 12.8 48.6 22.4v19.2L32 51.2 15.4 41.6V22.4z"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.4"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="32" r="5.4" fill="#ffffff" />
</svg>
