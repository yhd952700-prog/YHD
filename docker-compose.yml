services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liuhao-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: ${DATABASE_URL:-postgresql://liuhao:liuhao@postgres:5432/liuhao}
      SECRET_KEY: ${SECRET_KEY:-replace-me}
      # JWT 签名密钥。留空 → 每个进程各生成一把：重启即全端登出，多 worker
      # 还会让登录「成功」而下一个请求 401。生成一把再填：
      #   python -c "import secrets;print(secrets.token_urlsafe(48))"
      # 注意：占位串（replace-me / *** 等）会被应用**拒绝**，等同于没设。
      LIUHAO_JWT_SECRET: ${LIUHAO_JWT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PERSIST: ${METRICS_PERSIST:-1}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liuhao

  postgres:
    image: postgres:16-alpine
    container_name: liuhao-postgres
    environment:
      POSTGRES_USER: liuhao
      POSTGRES_PASSWORD: liuhao
      POSTGRES_DB: liuhao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liuhao -d liuhao"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - liuhao

networks:
  liuhao:
    driver: bridge

volumes:
  postgres_data:
