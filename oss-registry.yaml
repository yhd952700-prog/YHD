      的**事件总线**职责严格分开：taskiq 是「执行这个任务一次」的点对点队列，
      msg_bus 是「这件事发生了」的广播扇出，界限写在 src/tasks/broker.py 模块文档。
      默认 broker 是自实现的 SQLite 持久化队列（src/tasks/sqlite_broker.py），
      **不要求 Redis/Postgres**；Redis broker 仅在显式 LIUHAO_TASK_BROKER=redis 且
      安装可选 extra taskiq-redis 时启用，未安装时抛明确错误、不做静默降级。
      worker 侧强制审计（AUDIT_DB_PATH 缺失即拒绝启动）。MIT，无 copyleft 约束。
      补充：单机的时间点执行/指数退避重试/死信不走 taskiq 调度，由自研
      src/tasks/local_scheduler.py（仅 SQLite + 标准库）负责；taskiq 只做跨进程
      队列与周期投递，不存在第二套调度器。

