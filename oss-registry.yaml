      fastmcp 4.x 由 slim 发行包提供，client/server extras 才带 mcp 客户端与服务端代码
      （裸包只 import，缺 extras 时 import 直接报 "client/server support is not installed"）。
      版本钉死 ==4.0.3，与 requirements.txt 一致；上界受 arize-phoenix 的
      fastmcp-slim<5,>=4 约束，不能降到 3.x。Apache-2.0，无 copyleft 传染。

  - name: taskiq
