# 鎏灏 · 开源组件登记册（OSS Component Registry）
#
# 用途：记录每个外部开源组件的来源与许可证，供 `scripts/verify_oss_licenses.py`
# 做机器校验。新增任何第三方依赖都必须先登记在这里，否则护栏会报错。
#
# 数据口径：license 字段取自本机 .venv 的 importlib.metadata（真实读取，非人工估计）。
# 字段说明：
#   name          PyPI 分发名
#   import_name   实际 import 名（通常与分发名不同，如 opentelemetry-api -> opentelemetry）
#   license       实测许可证表达式（来自包元数据）
#   category      所属技术领域
#   used          src/ 中是否真实引用。取值：
#                 yes      —— 有顶层导入（也用于 alembic / pytest 这类经配置或测试链
#                             使用、不在 src/ 里 import 的项目级依赖）
#                 partial  —— 人工判断：部分接线
#                 guarded  —— 有引用，但只写在 try/except ImportError 保护块内
#                             （可选依赖，缺失时优雅降级）
#                 no       —— src/ 中确无任何导入（= 声明了却零引用）
#                 注：`no` 这一方向由 tests/test_oss_registry_used_field.py 机械校验，
#                 写错会直接变红；这正是初版把受保护导入误判为 no 的防复发措施。
#   risk          low / review / high（high = 需要 acknowledged 才能过护栏）
#   acknowledged  对 review/high 项的书面接受理由与约束；缺失则护栏失败
#   action        下一步处置建议

version: 1
generated: 2026-09-12

# ---------------------------------------------------------------- 允许的许可证
# MPL-2.0 是文件级 copyleft：仅使用、不修改其源文件时无传染风险，故列入允许，
# 但修改 MPL 文件则须公开该文件源码 —— 已在 note 中标注。
allow_licenses:
  - MIT
  - MIT License
  - Apache-2.0
  - Apache Software License
  - BSD-2-Clause
  - BSD-3-Clause
  - BSD License
  - ISC
  - PSF-2.0
  - Unlicense
  - CC0-1.0
  - MPL-2.0
  # ZPL-2.1（Zope Public License 2.1）：OSI 批准，与 BSD 同类的宽松许可，无
  # copyleft 传染。RestrictedPython 用它。以 PyPI 官方包形式按原样使用、不修改
  # 且不重新分发其源文件，风险等同 BSD。
  - ZPL-2.1

# ------------------------------------------------------- 受限许可证（必须 acknowledged）
restricted_licenses:
  - AGPL-3.0
  - GPL-3.0
  - LGPL-3.0
  - SSPL
  - Elastic-2.0
  - BSL
  - OpenRAIL-M
  - CC-BY-NC

