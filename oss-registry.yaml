      （2026-11-05 阶段 B1 由 not-wired 改为 adapter-only），运行时入口
      initialize_mcp() 受 LIUHAO_MCP_ADAPTER_ENABLED 开关控制、默认关闭。且 stdio 传输
      会直接执行配置里的 command 字符串（即便连接失败命令也已执行；OX Security 2026
      披露的架构级缺陷，涉及 20 万+ 实例）—— 适配层已加命令白名单
      （LIUHAO_MCP_STDIO_ALLOWED_COMMANDS，默认 python/node/npx/uv/uvx/docker 等）。
      主链路接线前三项前置条件缺一不可：仅白名单命令、强制沙箱执行、走 Policy 执法链
      并留审计。许可证 MIT，无约束。
      版本漂移已实测收口（2026-09-13）：以 uv 一次性环境分别装 mcp==1.29.1 与 mcp==2.1.1，
      对 mcp_adapter.py 的全部顶层导入（from mcp import ClientSession, StdioServerParameters,
      stdio_client；from mcp.types import Tool, Resource, Prompt, CallToolResult,
      ReadResourceResult, GetPromptResult）逐一实测 —— 两个大版本下均全部可用，故
      mcp>=1.24.0 不设上界是安全的。uv.lock 亦已重新生成（222 包，含 mcp），陈旧问题一并消除。
      ⚠️ 2026-11-05（阶段 B1）更正：适配层改用 FastMCP 后，mcp_adapter.py 只保留
      `from mcp.types import ...`，`fastmcp-slim[client,server]==4.0.3` 要求 `mcp>=2.0,<3.0`，
      与 requirements.txt 锁定的 mcp==2.1.1 一致，pyproject 已改为 `mcp>=2.0.0,<3.0.0`。
      本机 .venv 的 1.29.0 是 semgrep 1.183.0（`mcp==1.29.0` 硬钉，CI 专用扫描器、
      非本项目依赖）造成的漂移；升级后本地 .venv 内的 semgrep CLI 需另装独立环境。

  - name: fastmcp-slim
