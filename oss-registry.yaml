# ---------------------------------------------------------------- 非 Python 随包组件
# 2026-11-13 D-打包补：SBOM / THIRD-PARTY-NOTICES 里的 25 个非 Python 组件
# （CPython、OpenSSL、SQLite、Tcl/Tk、react 等，含 LGPL-2.1 的 iconv）。
# 护栏脚本 scripts/verify_oss_licenses.py 只枚举 *.dist-info，查不到它们，
# 故另立一节登记，不混入 `components:`（后者仍只含 Python 分发，漂移口径不变）。
# 本节不参与护栏脚本的机器校验，但发包前须人工核对：名字/版本/许可证须与
# 本次安装包的 sbom-cyclonedx.json 与 THIRD-PARTY-NOTICES.txt 第 3、4 节一致。
# 版本口径：凡标注“嵌入版 3.12.10 实测”的，均按本次构建的嵌入版 Python 3.12.10
# 二进制核对过（python312.dll / libcrypto-3.dll / sqlite3.dll / vcruntime140.dll
# 的版本资源与字符串，见 D-打包核对）；libxml2 / libxslt 两项在 Linux 交叉构建机上
# 探针取不到，沿用生成器回退值，待真 Windows 探针复核。
# adodbapi 与 Tix 两项的二进制已被打包剪裁移出安装包（A7 / A5），`shipped: false`；
# 其许可证全文仍随包（adodbapi 的 LGPL 文本已随其移除而删；Tix 全文仍随包备查），
# 登记在此仅为留档说明，不得理解为随包分发。
